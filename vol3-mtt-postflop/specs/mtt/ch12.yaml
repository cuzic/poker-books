    title: "3BP IP守備（トラップ vs CR）"
    side: "IP"

  - type: quiz
    title: "第12章 確認クイズ"
    questions:
      - setup: "SBR=25。SB（3ベット側・OOP）がBTNのレイズに3ベット、BTN呼び。フロップ K♠9♦4♥。SBの手牌: 9♦9♠（セット）。"
        question: "フロップのSBの行動は？"
        answer: "チェック（チェックレイズ狙い）"
        reason: "OOPでセットはナッツ帯→チェック。BTNがCBetしてきたらレイズ。SPR≈2.7でコミット確定。"
      - setup: "SBR=20。BTN（コール側・IP）がSBの3ベットを呼んだ。フロップ Q♠9♦4♥。BTNの手牌: J♦J♣（オーバーペア）。"
        question: "フロップのBTNの行動は？"
        answer: "チェック（トラップ）"
        reason: "IPでオーバーペアはトラップ帯→チェックコール。相手のCBetを誘いSPR≈2.2でコミット。"
      - setup: "SBR=25。BTN（コール側・IP）がCOの3ベットを呼んだ。フロップ T♠8♦6♥。BTNの手牌: K♣J♠（Kハイ+OESD）。"
        question: "フロップのBTNの行動は？"
        answer: "ベット（エクイティ主導、GTO87%）"
        reason: "KハイはK+OESDでブロッカー価値（AKブロック）＋16アウツ。エアー+OESDとは違いBET。SPR2.7でセミブラフが有効。"
      - setup: "バブル。SBR=25（3BP SPR≈2.7）。SB（OOP）でトップペア（top_pair、HS≈65）。通常コミットHS≥42。バブルICM補正+10HS。"
        question: "コミットするか？"
        answer: "コミット可（HS 65 ≥ バブルライン52）"
        reason: "バブルコミットHS=42+10=52。HS65はライン超え。ただしFTでは+15HS=57、ギリギリ超えるが慎重に。"

