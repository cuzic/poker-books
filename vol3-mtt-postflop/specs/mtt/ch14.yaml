    content: |
      ## 14-7　ターン実例計算

      **例1：SBR=22（SPR≈6.7）、中盤、BTN vs BB。フロップCBet→コール後のターン**

      フロップボード: K♣8♦5♠（型5：K-highドライ）
      ターンカード: 9♦（2ndペアターン → TA+）
      手: A♠J♦（ace_high+gutshot+後付き）
      TA+判定: Yes（9♦は2ndペアに相当）
      SPR確認: SPR≈6.7≥5 → 全レンジバレル候補
      CBS(ace_high+gutshot) = 5+1 = 6 → BTN閾値超
      バレル決定: Yes（全レンジバレル33%）

      **例2：同じ局面でバブル**

      TA+でもエアー（HS≤34）はチェックに変更
      A♠J♦のHS≈28（エアー圏）→ バブルでチェックに変更
      バブル判断: チェックバック（エアーICM削減ルール）

      **例3：SBR=20（SPR≈6）、中盤、SB vs BB（OOP視点）**

      フロップボード: K♣8♦5♠
      ターンカード: A♦（OCターン）
      手（SB）: K♠9♦（top_pair+gutshot）
      OOP逆説: Aターン → SBは大サイズ（75%+）でポラライズベット
      K♠9♦のHS≈78（TP強+GS）→ バリューでの大ベット
      判断: 75%ポットでバリューベット

      ## 14-8　リバー実例計算

      **例1：中盤、リバー50%ブラフ判断**

      α計算: 50/(100+50+50) = 25%（必要フォールド率）
      中盤ICM補正なし（α式そのまま）
      相手のフォールド推定: 35%（十分）→ ブラフ実行

      **例2：バブル、同じ状況**

      バブル補正: 必要フォールド率 = 25% ÷ 0.7 = 36%
      相手のフォールド推定: 35% < 36% → ブラフ不実行（フォールド不足）
      判断: チェック/フォールド（バブルは基準が厳しい）

