summary: |
  vol2で学んだTA（ターンアドバンテージ）フレームワークをMTT環境に適用します。
  「TA+なら全レンジバレル、TA-なら選択的バリューのみ」という基本を維持しながら、
  SPR確認・ICMエアー削減・OOP逆説ベット・α式MTT補正の4つの修正を加えます。

sections:
  - type: text
    content: |
      ## 14-1　TAフレームワークの復習

      vol2で学んだTA（ターンアドバンテージ）判定の復習です。

      ```
      TA+ = 2nd/3rdペアターン → 全レンジバレル（SPR≥5）
      TA- = OC/ブランク  → バリューのみ（HS≥65）
      ```

      IPとOOPではTA判定の影響が逆方向です：
      - IP（BTN）: TA+で積極的に、TA-で消極的に
      - OOP（SB/BB）: カード種別によらず25〜57%ベット（フラットな範囲）

      ## 14-2　MTT補正を加えたTA判断

      MTTでのTA+バレルには4つの修正が必要です：

      **修正1：SPR確認を最優先**

      TA+判定の前にSPRを確認します。SPR<5（SBR≤15）ではコミット閾値の確認が先です。

      ```
      SPR≥5: TA+なら全レンジバレル（33%サイズ）
      SPR<5: TA+でもバリューのみ（HS≥42）バレル
      ```

      **修正2：ICMエアー削減**

      バブル・FTではTA+でもエアー（HS≤34）をチェックに変更します。

      ```
      通常: TA+なら全レンジバレル
      バブル: TA+でもエアーはチェック。バリュー（HS≥35）のみ継続
      ```

      **修正3：OOP逆説ベット**

      OOP（SB/BB）はIPと逆で、OCターンで大サイズ（75%+）のポラライズベットを打ちます。
      GTO実測（SBR25 SBvsBB）: A/KターンでOOP 42〜57%ベット率

      **修正4：α式ICM補正**

      リバーブラフはα式にICM係数を掛けます：
      - バブル: α×0.7
      - FT: α×0.6

