  - type: text
    content: |
      ## 14-3　ターンバレル判断フロー

      ```
      Step 1: SPR確認（SPR<5なら先にコミット判断）
      Step 2: TA判定（2nd/3rdペアターン？ → TA+）
      Step 3: TA+ かつ SPR≥5: 全レンジバレル33%
      Step 4: TA+ かつ SPR<5: HS≥42のみバレル
      Step 5: TA-: バリュー（HS≥65）のみ
      Step 6: バブル/FT補正: TA+エアー（HS≤34）はチェックに変更
      ```

      ## 14-4　GTO実測：ターンバレル率

      GTO実測（SBR25 MTTGeneral BTN vs BB SRP）のターンバレル率：

      | ボード型 | TA+ターン | TA-ターン |
      |--------|---------|---------|
      | 型1（A-highドライ） | 61% | 15%以下 |
      | 型2（K/Q-highウェット） | 72〜79% | 20%以下 |
      | 型3（コネクテッド） | 36〜48% | 10%以下 |
      | 型5（K/Q/J-highドライ） | 18% | 10%以下 |
      | 型7（ペア板） | K-OCのみ37% | チェック |

      ## 14-5　リバー戦略

      リバーはバリューとブラフの二極化が核心です。

      **バリュー（HS≥65）**

      ICM問わずリバーベットを継続します。サイズは50〜75%ポットが中心です。
      SPR残量が少なければオールインを選択します。

      **ブラフ（HS≤34）**

      α式でフォールド率を計算し、ICM係数で補正します。

      ```
      必要フォールド率表:
        33%ベット → 25%必要フォールド
        50%ベット → 33%必要フォールド
        75%ベット → 43%必要フォールド
      ```

      バブルでは必要フォールド率が1.43倍（÷0.7）に増えます。
      FTでは1.67倍（÷0.6）になります。

      **薄いバリュー（HS35〜64）**

      バブル・FTでは相手がオーバーフォールド傾向になるため、
      HS35〜64の「薄いバリュー」が通りやすくなります。33%小ベットで価値を取れます。

      ## 14-6　OOP逆説のリバー適用

      OOP（SB/BB）のリバーリードは基本的にナッツ近辺（HS≥75）のみです。
      OOPブラフリードはバブル以降は禁止です。

      ```
      OOPリバーリード基準:
        通常: HS≥75（ナッツ近辺）で50〜75%リード
        バブル: HS≥75のバリューのみ。ブラフリード禁止
      ```

