chapter_num: 12
title: "ターン・リバー——TAフレームワークとMTT補正"

summary: |
  vol2で学んだTA（ターンアドバンテージ）フレームワークをMTT環境に適用し、
  SBRの浅さとICM圧力によってターン・リバー判断がどう変わるかを理解します。
  本章では「TA+ならバレル、TA-ならチェック」という基本を維持しながら、
  SPR確認・ICMエアー削減・OOP逆説ベット・α式MTT補正という4つの修正を加えます。

scenarios:
  # ─── T01B: BTN ターンバレル（TA+フレームワーク）───
  - id: T01B
    title: "BTN ターンバレル——TA+/TA-判定"
    description: |
      フロップCBet後にターンが来たとき、ターンカードの種類だけでバレル判断を行います。
      2nd/3rdペアターン（TA+）なら全レンジ継続、OC/ブランク（TA-）ならバリューのみです。
      SPR確認が先決です。SPR<5（SBR≤15）ではTA+判定の前にコミット閾値を確認します。
    decision_table:
      - board_type: "型1（A-highドライ）"
        sbr25: "TA+: 全レンジバレル 61% / TA-: チェック"
        sbr20: "TA+: HS≥55 のみバレル / TA-: チェック"
        note: "2ndペア=TA+、A-OC=TA-"
      - board_type: "型2（K/Q-highウェット）"
        sbr25: "TA+: 全レンジバレル 72〜79% / TA-: チェック"
        sbr20: "TA+: HS≥55 のみバレル / TA-: チェック"
        note: "2ndペア・3rdペアどちらもTA+"
      - board_type: "型3（コネクテッド）"
        sbr25: "TA+: 36〜48% バレル / TA-: チェック"
        sbr20: "TA+: HS≥55 のみ / TA-: チェック"
        note: "TA+でもバレル率が低い（レンジ不利）"
      - board_type: "型5（K/Q/J-highドライ）"
        sbr25: "TA+弱: HS≥55 のみ18% / TA-: チェック"
        sbr20: "TA+弱: HS≥55 のみ / TA-: チェック"
        note: "型5はTA+効果が弱い（1stペア型）"
      - board_type: "型7（ペア板）"
        sbr25: "K-OC: 37% バレル / その他: チェック"
        sbr20: "K-OC: HS≥65 のみ / その他: チェック"
        note: "ペア板はTA+例外（K-OCのみ）"
    decision_caption: "ターンバレル判断（BTN vs BB SRP・IP視点）"
    flow_title: "ターンバレル判断フロー（T01B）"
    flow_steps:
      - "SPR確認: SPR<5（SBR≤15）→ コミットラインを先に確認"
      - "TA判定: 2nd/3rdペアターン？ → YES=TA+, NO=TA-"
      - "TA+ かつ SPR≥5: 全レンジバレル（33%サイズ）"
      - "TA+ かつ SPR<5: バリューのみ（HS≥42）バレル"
      - "TA-: バリューのみ（HS≥65）でチェックレイズ準備"
      - "バブル/FT補正: TA+でもエアー（HS≤34）はチェックに変更"
    flow_notes:
      - "MTT GTO実測（SBR25）: 型1=61%, 型2=72〜79%, 型3=36〜48%（全TA+ターン）"
      - "SBR≤50では全IPポジション（UTG/HJ/CO/BTN）が同一バレル率を示す"
    memorize:
      - "TA+ = 2nd/3rdペアターン → 全レンジバレル33%（SPR≥5）"
      - "TA- = OC/ブランク → バリューのみチェックレイズ準備"
      - "バブル補正: エアー（HS≤34）はTA+でもチェックに変更"
    icm_note: "バブル・FTではTA+エアーバレルを削減。バリュー（HS≥35）は継続。"

  # ─── T03B: BTN Delayed CBet（フロップcheck後）───
  - id: T03B
    title: "BTN Delayed CBet——フロップcheck後のターン"
    description: |
      フロップでIPがチェックした後、ターンでベットする「ディレイドCBet」です。
      フロップチェックはTA-（弱いターン）を見てからバリューを積む作戦です。
      ディレイドCBetはTA+ターン到来時に特に有効です。
    decision_table:
      - board_type: "TA+ターン到来"
        sbr25: "ディレイドCBet 推奨（全レンジ相当）"
        sbr20: "HS≥42 のみバレル（コミット確認）"
        note: "フロップcheck→TA+ターン=理想のディレイド"
      - board_type: "TA-ターン（OC）"
        sbr25: "HS≥65（TPTK）のみベット"
        sbr20: "HS≥65 のみ（サイズ50%で積む）"
        note: "OCターンはナッツバリューのみ"
      - board_type: "ブランクターン"
        sbr25: "チェック（ショーダウン志向）"
        sbr20: "チェック"
        note: "ブランクは利益なし、チェックパス"
    decision_caption: "Delayed CBet判断（フロップX後のターン）"
    flow_title: "Delayed CBet判断フロー（T03B）"
    flow_steps:
      - "ターンカード確認: 2nd/3rdペア？ → TA+"
      - "TA+: Delayed CBetを打つ（33〜50%ポット）"
      - "OC（エース・キング等）: TPTK以上のみ大サイズ（50〜75%）"
      - "ブランク: チェック→ショーダウン"
    memorize:
      - "フロップX→TA+ターン = ディレイドCBetの絶好機"
      - "OCターンのDelayed CBetはナッツバリューのみ（HS≥65）"
    icm_note: "バブルでは Delayed CBetブラフ成分を0に。バリューのみ。"

  # ─── T04B: BB ターンリード（プローブベット）───
  - id: T04B
    title: "BB ターンリード——プローブベット（OOP）"
    description: |
      フロップでIPがチェックした後、OOP（BB）がターンでリードするのがプローブベットです。
      IPのフロップチェックは「弱い」サインのため、BBが積極的にターンでポットを奪いに行きます。
      SBR25（SPR≈8）のMTT実測では型1〜4の多くのボードでプローブが有効です。
    decision_table:
      - board_type: "型1（A-highドライ）"
        sbr25: "HS≥35（セカンドペア以上）でプローブ33%"
        sbr20: "HS≥42 でプローブ"
        note: "IPがフロップXしたA-highは弱いことが多い"
      - board_type: "型2（K/Q連）"
        sbr25: "HS≥42 でプローブ33%"
        sbr20: "HS≥42 でプローブ"
        note: "コネクテッドはIPが弱くてもドロー注意"
      - board_type: "型3（コネクテッド）"
        sbr25: "プローブ頻度低め（HS≥55 のみ）"
        sbr20: "HS≥55 のみ"
        note: "コネクテッドはIPのドローあり、慎重に"
      - board_type: "型7（ペア板）"
        sbr25: "HS≥55 でプローブ（ペア板は反応を見る）"
        sbr20: "HS≥55 のみ"
        note: "ペア板はIPのセットが怖い"
    decision_caption: "BBプローブベット判断（フロップIP check後）"
    flow_title: "BBプローブベット判断フロー（T04B）"
    flow_steps:
      - "IPがフロップチェックバック確認 → プローブ機会"
      - "HS確認: HS≥42（セカンドペア+）→ プローブ推奨"
      - "ボード型確認: 型1/2 → 積極的、型3/7 → 慎重"
      - "サイズ: 33〜50%ポット（大サイズ不要）"
    memorize:
      - "IPフロップX → BBプローブ機会（HS≥42で打てる）"
      - "型3コネクテッドは慎重（IPドロー継続注意）"
    icm_note: "バブルではプローブ後のシャットダウンを計画。2バレル継続しない。"

  # ─── T07S: SB vs BB ターン（OOP逆説ベット）───
  - id: T07S
    title: "SB ターン継続——OOP逆説戦略"
    description: |
      SBがOOPでフロップCBetを打った後のターン戦略です。
      IPと逆で、OOPはカード種別によらず25〜57%ベットを継続します。
      特にOCターン（エース等の高いカード）ではIPが0%チェックなのに対し、OOPは57%の大サイズで打ちます。
    decision_table:
      - board_type: "2nd/3rdペアターン（TA+相当）"
        sbr25: "23〜42% ベット継続（中サイズ）"
        sbr20: "HS≥35 でベット継続"
        note: "OOPはTA+でも節制気味"
      - board_type: "OCターン（A/K等）"
        sbr25: "42〜57% ベット（大サイズ75%〜）"
        sbr20: "HS≥55 で大サイズ"
        note: "OOPのOCベット=ポラライズ戦略"
      - board_type: "ブランクターン"
        sbr25: "29〜45% ベット（中サイズ）"
        sbr20: "HS≥42 でベット"
        note: "ブランクでもOOPはベット継続する"
    decision_caption: "SB ターン継続判断（OOP視点・SBvsBB SRP）"
    flow_title: "OOPターン戦略フロー（T07S）"
    flow_steps:
      - "OOP（SB）視点: カード種別でバレル率を大きく変えない"
      - "OCターン: 大サイズ（75%ポット以上）でポラライズベット"
      - "2ndペア: 中サイズ（33〜50%）でバレル継続"
      - "ブランク: 中サイズ（33%）でベット継続（IPチェック誘い）"
    flow_notes:
      - "IP（BTN/CO）のTA+/TA-大波対比: OOPは25〜57%のフラットな範囲"
      - "GTO実測（SBR25 MTTGeneral）: 型4 T98のAターン → OOP 57.4%ベット（R5.95）"
    memorize:
      - "OOPターンはカード種別によらず25〜57%ベット（IPとは逆）"
      - "OCターンのOOP大ベット = ナッツ or エアーのポラライズ"
    icm_note: "バブルではOOPターンバレルのブラフ成分を削減。OCポラライズは維持可。"

  # ─── T05B: BB CR-continuation（フロップCR後のターン）───
  - id: T05B
    title: "BB CR-continuation——フロップCR後のターン"
    description: |
      BBがフロップでCR（チェックレイズ）し、BTNがコールした後のターンです。
      CRで示したレンジアドバンテージを引き続き活かします。
      TA+ターンなら継続バレル、TA-ターンなら厳選してバリューのみ。
    decision_table:
      - board_type: "TA+ターン（2nd/3rdペア）"
        sbr25: "全レンジ継続バレル（50〜75%）"
        sbr20: "HS≥42 のみ（コミット圏注意）"
        note: "CRポット = SPR低め。コミット確認"
      - board_type: "TA-ターン（OC/ブランク）"
        sbr25: "HS≥65（TPTK）のみ継続"
        sbr20: "HS≥65 のみ"
        note: "CR後OC = バリューのみで積む"
    decision_caption: "CR後ターン継続判断（BB OOP視点）"
    flow_title: "CR-continuation判断フロー（T05B）"
    flow_steps:
      - "CRポットSPR確認（通常よりSPR低い）"
      - "TA+ターン: 継続バレル（コミット圏ならAIも視野）"
      - "TA-ターン: HS≥65 のみ継続、エアーはチェック"
    memorize:
      - "CRポットはSPR低め → ターンはコミット判断が絡む"
      - "TA+ターンはCR継続、TA-ターンは厳選バリューのみ"

  # ─── R01B: BTN リバーバリュー ───
  - id: R01B
    title: "BTN リバーバリュー——α式とICM補正"
    description: |
      ターンバレル後のリバーです。バリューはICMに関係なく積み続けます。
      ブラフはα式で計算した上で、バブル/FTでは大幅削減します。
      リバーのサイズは50〜75%ポットが中心です（スタック残量による）。
    decision_table:
      - board_type: "バリュー（HS≥65）"
        sbr25: "75%サイズでバリュー（相手コール誘い）"
        sbr20: "50〜75%（コミット圏は全イン）"
        note: "バリューはICM問わず継続"
      - board_type: "ブラフ候補（HS≤34）"
        sbr25: "中盤: α式適用。バブル: 削減（α×0.7）"
        sbr20: "バブル: ブラフ停止"
        note: "バブルの3バレルブラフは禁止"
      - board_type: "薄いバリュー（HS35〜64）"
        sbr25: "相手がオーバーフォールド傾向あれば33%で可"
        sbr20: "33% サイズで薄くバリュー"
        note: "ICM圧力で相手コール閾値が上がる"
    decision_caption: "リバーバリュー/ブラフ判断（BTN IP視点）"
    flow_title: "リバー判断フロー（R01B）"
    flow_steps:
      - "ハンド強度確認: HS≥65 → バリューベット（75%）"
      - "HS35〜64（薄いバリュー）: 相手フォールド傾向確認 → あれば33%"
      - "HS≤34（エアー）: α式確認 → バブル以降はフォールド"
      - "ブラフ判断: α=25%（33%ベット）で必要フォールド率確認"
      - "バブル/FT: ブラフ頻度 × 0.7（バブル）/ × 0.6（FT）"
    flow_notes:
      - "α式: α = ベット / (ベット + ポット). 33%ベット→α=25%必要フォールド"
      - "バブルでは薄いバリューが通りやすい（相手がオーバーフォールド）"
    memorize:
      - "バリュー（HS≥65）はICM問わずリバーベット継続"
      - "バブルの3バレルブラフは禁止（ICMコスト最大）"
      - "α式: 33%ベット=必要フォールド25%、50%ベット=33%"
    icm_note: "バブルのブラフ頻度はα×0.7。FTはα×0.6〜0.8。バリューは維持。"

  # ─── R02B: BB リバーディフェンス ───
  - id: R02B
    title: "BB リバーディフェンス——MDF×ICM補正"
    description: |
      BTNのリバーベットに対してBBが守る場面です。
      通常のMDF（最低守備頻度）を計算した上で、ICM圧力に応じてフォールドを増やします。
      HS（ハンドスコア）とポット内でのエクイティ比較で判断します。
    decision_table:
      - board_type: "通常MDF（中盤）"
        sbr25: "50%ベットに対しMDF=67% → HS≥42でコール"
        sbr20: "HS≥42（SPR残り少ない）"
        note: "MDF = 1 - α（ブラフ利益ゼロ線）"
      - board_type: "バブル補正"
        sbr25: "MDF×0.8 → HS≥52 でコール"
        sbr20: "HS≥52 でコール"
        note: "バブルはコール閾値を1段上げる"
      - board_type: "FT補正"
        sbr25: "MDF×0.7 → HS≥60 でコール"
        sbr20: "HS≥60 でコール"
        note: "FTはさらに守備を絞る"
    decision_caption: "リバーディフェンス閾値（BB OOP視点）"
    flow_title: "BBリバー守備判断フロー（R02B）"
    flow_steps:
      - "ベットサイズからα値計算: α=ベット/(ベット+ポット)"
      - "MDF計算: MDF=1-α"
      - "ステージ補正: 中盤=×1.0, バブル=×0.8, FT=×0.7"
      - "補正後MDFに対応するHS閾値でコール/フォールド判断"
    memorize:
      - "33%ベット→MDF75%, 50%ベット→MDF67%, 75%ベット→MDF57%"
      - "バブルはMDF×0.8（より多くフォールド）"
    icm_note: "バブル以降はリバーコール閾値を1段（約+10HS）引き上げる。"

  # ─── R03B: BB リバーリード ───
  - id: R03B
    title: "BB リバーリード——OOPバリューベット"
    description: |
      BBがターンまでコールした後、リバーで先手ベット（リード）する場面です。
      OOPリードはナッツ近辺の強いバリューに限定します。
      IPにフリーカードを与えない目的で、適切なサイズで打ちます。
    decision_table:
      - board_type: "ナッツ〜準ナッツ（HS≥75）"
        sbr25: "50〜75%リードベット"
        sbr20: "50%リードベット（コミット圏）"
        note: "強いバリューはリードで積む"
      - board_type: "中強度バリュー（HS55〜74）"
        sbr25: "33%薄いリード（情報収集）"
        sbr20: "チェック→コールで守備的に"
        note: "中強度はチェックが安全な場合も"
      - board_type: "ブラフ（HS≤34）"
        sbr25: "中盤のみ（α式確認）/ バブルは停止"
        sbr20: "停止"
        note: "OOPブラフはリスク高"
    decision_caption: "BBリバーリード判断（OOP視点）"
    flow_title: "BBリバーリード判断フロー（R03B）"
    flow_steps:
      - "HS≥75（ナッツ近辺）: リードベット推奨（50〜75%）"
      - "HS55〜74: チェック→コール or 薄いリード33%"
      - "HS≤34（エアー）: バブル以降はリードブラフ禁止"
    memorize:
      - "OOPリードはHS≥75のナッツ限定が原則"
      - "バブルのOOPリードブラフは禁止"

  # ─── R04B: BTN リバーブラフ判断 ───
  - id: R04B
    title: "BTN リバーブラフ——α式×ICM係数"
    description: |
      ターンバレル後のリバーで、ブラフするかどうかの判断です。
      α式で必要フォールド率を計算し、ICMステージ係数で補正します。
      バブル・FTでは3バレルブラフを原則禁止とします。
    flow_title: "リバーブラフ判断フロー（R04B）"
    flow_steps:
      - "α計算: 予定ベットサイズ ÷（ベット+ポット）= 必要フォールド率"
      - "相手の実際のフォールド推定値と比較"
      - "ステージ係数適用: 中盤=1.0, バブル=0.7, FT=0.6"
      - "係数後の必要フォールド率 < 相手フォールド推定: ブラフ実行"
      - "判断できない場合はフォールド（バブルのデフォルト）"
    flow_notes:
      - "必要フォールド率表: 33%ベット=25%, 50%=33%, 75%=43%, 100%=50%"
      - "バブルでは3バレルブラフのICMコストが極大"
    memorize:
      - "リバーブラフ前にα式でフォールド率計算"
      - "バブル×3バレルブラフ = 禁止（ICMコスト最大）"
      - "FTブラフ係数0.6 = 必要フォールド率を実質1.67倍に"
    icm_note: "バブルのα×0.7は「必要フォールドが1.43倍に増える」ことを意味する。"

summary_card:
  - "TA+判定: 2nd/3rdペアターン → 全レンジバレル33%（SPR≥5）"
  - "SPR確認が先: SPR<5はバレル前にコミット判断（HS≥42?）を先行"
  - "ICMエアー削減: バブルではTA+でもエアー（HS≤34）をチェックに変更"
  - "OOPターンは逆: カード種別によらず25〜57%ベット。OCは大サイズでポラライズ"
  - "バブル3バレルブラフ禁止: ICMコストが最大。リバーブラフはα×0.7で評価"
  - "バリューは継続: ICM問わずHS≥65はリバーまでバリューベット維持"
