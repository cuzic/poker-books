name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all formats for all volumes
        run: bun run build:site

      - name: List built EPUBs
        run: |
          echo "Built EPUB files:"
          find dist -name "*.epub" -type f | sort

      - name: Upload EPUB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epub-files
          path: dist/*/mayowanai-poker-*.epub
          retention-days: 30
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/site'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  upload-to-dropbox:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Download EPUB artifacts
        uses: actions/download-artifact@v4
        with:
          name: epub-files
          path: ./epub

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dropbox SDK
        run: pip install dropbox

      - name: Upload to Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_FOLDER: ${{ vars.DROPBOX_FOLDER || '/poker-books-epub' }}
        run: |
          # Dropbox 認証情報が未設定ならスキップ
          if [ -z "$DROPBOX_ACCESS_TOKEN" ] && [ -z "$DROPBOX_REFRESH_TOKEN" ]; then
            echo "Dropbox credentials not configured; skipping upload."
            echo "To enable: add DROPBOX_ACCESS_TOKEN secret (short-lived) or"
            echo "DROPBOX_REFRESH_TOKEN + DROPBOX_APP_KEY + DROPBOX_APP_SECRET (long-lived) to repository settings."
            exit 0
          fi
          python << 'PYTHON_EOF'
          import os
          import sys
          import dropbox
          from dropbox.files import WriteMode

          access_token = os.environ.get('DROPBOX_ACCESS_TOKEN', '').strip()
          refresh_token = os.environ.get('DROPBOX_REFRESH_TOKEN', '').strip()
          app_key = os.environ.get('DROPBOX_APP_KEY', '').strip()
          app_secret = os.environ.get('DROPBOX_APP_SECRET', '').strip()
          folder = os.environ['DROPBOX_FOLDER']

          # Prefer refresh token if available (long-lived); fallback to access token
          if refresh_token and app_key and app_secret:
              dbx = dropbox.Dropbox(
                  oauth2_refresh_token=refresh_token,
                  app_key=app_key,
                  app_secret=app_secret,
              )
              print(f"Using refresh token authentication")
          elif access_token:
              dbx = dropbox.Dropbox(oauth2_access_token=access_token)
              print(f"Using access token authentication")
          else:
              print("No Dropbox credentials available; exiting.")
              sys.exit(0)

          # Verify auth
          try:
              account = dbx.users_get_current_account()
              print(f"Authenticated as: {account.name.display_name} ({account.email})")
          except Exception as e:
              print(f"Auth verification failed: {e}")
              sys.exit(1)

          epub_dir = './epub'
          uploaded = []
          failed = []

          for root, dirs, files in os.walk(epub_dir):
              for filename in sorted(files):
                  if not filename.endswith('.epub'):
                      continue
                  filepath = os.path.join(root, filename)
                  dropbox_path = f"{folder}/{filename}"
                  size_kb = os.path.getsize(filepath) / 1024

                  with open(filepath, 'rb') as f:
                      data = f.read()

                  try:
                      dbx.files_upload(data, dropbox_path, mode=WriteMode.overwrite)
                      print(f"✓ Uploaded: {filename} ({size_kb:.1f} KB) → {dropbox_path}")
                      uploaded.append(filename)
                  except Exception as e:
                      print(f"✗ Error uploading {filename}: {e}")
                      failed.append(filename)

          print()
          print(f"Upload summary: {len(uploaded)} succeeded, {len(failed)} failed")
          if failed:
              print(f"Failed files: {failed}")
              sys.exit(1)
          PYTHON_EOF
