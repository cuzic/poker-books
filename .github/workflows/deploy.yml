name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build both books
        run: |
          # ビルドスクリプトは $ROOT を /home/cuzic/poker-books 固定で参照しているため
          # CI 環境に合わせてリポジトリルートに差し替えて実行する
          sed "s|^ROOT=.*|ROOT=\"$GITHUB_WORKSPACE\"|" scripts/build.sh > scripts/build.ci.sh
          chmod +x scripts/build.ci.sh
          bash scripts/build.ci.sh all

      - name: Assemble site
        run: |
          mkdir -p site
          cp dist/preflop/book.html site/preflop.html
          cp dist/flop/book.html site/flop.html
          cp scripts/index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
