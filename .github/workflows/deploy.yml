name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all formats for all volumes
        run: bun run build:site

      - name: Upload epub artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epub-books
          path: dist/**/*.epub
          retention-days: 90

      - name: Upload epub to Dropbox
        env:
          DROPBOX_APP_KEY:      ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:   ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          ACCESS_TOKEN=$(curl -fsSL -X POST https://api.dropbox.com/oauth2/token \
            -d grant_type=refresh_token \
            -d refresh_token="$DROPBOX_REFRESH_TOKEN" \
            -d client_id="$DROPBOX_APP_KEY" \
            -d client_secret="$DROPBOX_APP_SECRET" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          for epub in $(find dist -name "*.epub"); do
            name=$(basename "$epub")
            echo "Uploading $name ..."
            curl -fsSL -X POST https://content.dropboxapi.com/2/files/upload \
              --header "Authorization: Bearer $ACCESS_TOKEN" \
              --header "Dropbox-API-Arg: {\"path\":\"/poker-books/$name\",\"mode\":\"overwrite\"}" \
              --header "Content-Type: application/octet-stream" \
              --data-binary @"$epub"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/site'
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
