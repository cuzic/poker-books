# vol4 MTT ポストフロップ シナリオ仕様 インデックス
# Task #32 / Gen-12a / 2026-05-22

meta:
  book: vol4-mtt-postflop
  total_scenarios: 26
  format_version: 1.0
  last_updated: 2026-05-22
  scope:
    in:
      - HU SRP（BTN/CO vs BB/SB）
      - HU 3BP（一部）
      - SBR 10〜40+
      - Flop / Turn / River
      - 序盤・中盤・バブル・FT
    out:
      - マルチウェイ（3人以上）
      - SBR<10 詳細（push/fold で完結）
      - 4BP（フロップ着地で全イン）

