  - type: text
    content: |
      ## 11-3　FTでのコミットライン実例

      **FT-9人、ミドルスタック、SBR=20（SPR≈6）**

      - 通常コミット: HS≥55（TPMK）
      - ICM補正+10%（+7〜8HS）→ HS≥62〜63
      - 実質: TPTK弱以上でコミット（TPMKはアウト）

      **FT-5人、ミドルスタック、SBR=25（SPR≈8）**

      - 通常コミット: HS≥65（TPTK）
      - ICM補正+15%（+11〜13HS）→ HS≥76〜78
      - 実質: 2ペア以上でなければコミット不可

      **FT-3人、ショートスタック、SBR=15（SPR≈4.5）**

      - 通常コミット: HS≥42（2ndペア強）
      - ICM補正+20%（+15HS）→ HS≥57
      - 実質: TPMK相当以上が必要（ほぼTP以上）

      ## 11-4　FTのブラフ戦略

      FTでのブラフは中盤より大幅に削減します。

      ```
      FTブラフ頻度 = 通常 × 0.6（ミドルスタック）
                  = 通常 × 0.4（ショートスタック）
      ```

      バリュー（HS≥65）はFTでも継続してベットします。

      **FT特有のブラフ許容場面**

      ビッグスタックvsショートスタックの場面では、ブラフが有効になります。
      ショートはICM圧力でフォールドを余儀なくされるためです。

      | 相手スタック | ブラフ可否 |
      |-----------|---------|
      | vs ビッグ（同等以上） | 大幅削減（×0.4） |
      | vs ミドル | 削減（×0.6） |
      | vs ショート | 拡大可能（通常以上） |

      ## 11-5　HU（2人）の特別処理

      ファイナルテーブルの最終2人（HU）になると、ICMは消滅します（1位か2位かだけ）。
      HU戦ではバブル的な制約がなくなり、キャッシュゲームに近い判断に戻ります。

      ただし、賞金格差が大きい場合は「2位賞金でも十分大きい」というICMライクな判断が残ります。
      HUでは一般的に「コール閾値を30〜40に下げる（何でもコール）」が推奨されます。

      ## 11-6　FT戦略まとめ

      ```
      FTの判断順序:
      1. 現在の人数確認（9人/7人/5人/3人/HU）
      2. 自分のスタック位置確認（ビッグ/ミドル/ショート）
      3. ICM補正量を確認（表参照）
      4. コミットラインを修正（通常+ICM上乗せHS）
      5. ブラフ係数を確認（×0.6〜×0.4）
      ```

