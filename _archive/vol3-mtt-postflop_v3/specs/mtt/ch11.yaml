  - type: text
    content: |
      ## 11-7　FTの実例計算

      **例1：FT-9人、ミドルスタック（SBR=22）、BTN vs BB**

      ボード: K♣9♦4♠（型5：K-highドライ）
      手: A♠J♦（ace_high、no_draw）
      CBS = HP(5) + DP(0) = 5 = BTN閾値 → ベット方向（境界）
      コミットライン: SPR≈6.7 → 通常HS≥60
      FT-9人ミドル補正+7〜8HS → HS≥67〜68
      A♠J♦はAハイ（HS≈30程度）→ コミット外。エアーCBetのみ考慮
      FT-9人型5でエアーCBet: ×0.6補正（型5は元々慎重）→ かなり低頻度

      **例2：FT-5人、ミドルスタック（SBR=20）、BB vs BTNのCR対応**

      ボード: Q♣8♦4♠（型5）
      手: Q♠9♦（top_pair、no_draw）
      CBS = 7（TPTK） → ベット方向
      コミットライン通常: SPR≈6 → HS≥55
      FT-5人ミドル補正+11〜13HS → HS≥66〜68
      Q♠9♦のHS≈62（TPMK）→ FT-5人ではコミット外
      BBからCRが来た場合: 降りを選択（TPMKはFT-5人でコミット外）

      ## 11-8　FT戦略のまとめ

      FTで一貫したアドバンテージを得るためのルール：

      | 自分のスタック | 基本方針 |
      |------------|---------|
      | ビッグ     | 積極的CBet継続。ショートへの圧力を最大化 |
      | ミドル     | 標準ICM補正。バリューのみ、エアーは絞る |
      | ショート   | プッシュ/フォールドライン。コインフリップ機会を待つ |

      FTはバブルと違い「賞金を増やす」戦いです。ショートは脱落リスクを取ってでも
      チップを取りに行く局面が来ます。バブルより攻撃的な場面が出てくることを意識してください。

