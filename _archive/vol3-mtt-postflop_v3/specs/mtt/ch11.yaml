chapter_num: 11
slug: 11-final-table
title: "ファイナルテーブル——賞金格差とICM最大化"
output: "chapters/11-final-table.md"

summary: |
  ファイナルテーブル（FT）ではICM補正が+10〜30%に達し、スタック量と人数によって補正が大きく変動します。
  ビッグスタックは攻撃的、ミドル/ショートスタックは防御的という非対称戦略が理想です。
  バリューは継続してベットしますが、ブラフはα×0.6まで削減します。

sections:
  - type: text
    content: |
      ## 11-1　FTのICM構造

      ファイナルテーブルでは賞金格差が最大化します。
      1位と9位の賞金差が大きいほど、ICM補正も大きくなります。

      FTのICM補正目安（ミドルスタック基準）：

      | FT人数 | ICM補正 | コミット上乗せ |
      |-------|--------|------------|
      | 9人残り | +10% | +7〜8HS |
      | 7人残り | +12% | +9HS |
      | 5人残り | +15% | +11〜13HS |
      | 3人残り | +10〜20% | スタック量依存 |
      | HU（2人） | バブルなし | +5〜10HS |

      ## 11-2　スタック量×FT人数のクロス補正

      FTでのICM補正はスタック量で大きく変わります。

