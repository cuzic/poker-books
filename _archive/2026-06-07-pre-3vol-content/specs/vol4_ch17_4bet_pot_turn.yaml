gto_reference:
  source: "GTO Wizard 4-bet pot ターン解析 + SPR < 1 commit theory"
  notes: |
    4-bet ポットのターン GTO 傾向 (Pio Solver, BTN vs BB 4-bet pot):
      IP push 頻度 (SPR < 1 時): ~85-90%
        理由: 残りスタックが少ないため、チェックして「後でベット」が難しい
        → T1 以上で即プッシュが EV 最大化

      OOP コール頻度 (vs IP all-in):
        SPR=0.86: ~50-55% (ポットオッズが 31-46% 程度 → 中程度ハンドでコール)

      ブラフ push 比率:
        SPR<1: GTO でも 15-20% 程度 (通常ポットの 30% より低い)
        理由: OOP のコール頻度が高い (コミット傾向) → ブラフが通りにくい

    コミット閾値の根拠:
      SPR=0.86 で push に対する OOP コール ポットオッズ ≈ 46%
      HS=55 程度のハンドがエクイティ ≈ 50% 前後 → コール境界線として機能

key_points:
  - "4-bet pot ターン SPR ≈ 0.86: push/fold の2択のみ (中途半端なサイズなし)"
  - "IP push 基準: HS ≥ 65 (T1) でバリュー push。T3 (Air 系) はチェック"
  - "OOP コール必要エクイティ ≈ 46%: TPTK (HS≥65) でコール、セカンドペア以下はフォールド"
  - "SPR < 1 ではブラフの FE が低い: OOP はコミット気味でフォールドしにくい"
  - "フロップ call 後のターン計画を事前に立てる: push できないなら fold が最善"
  - "コンボドロー (equity≈50-60%) はコール圏内: TPTK 相当のコール基準を満たす"

sections:
  - title: "SPR < 1 = all-in の世界"
    summary: |
      4-bet ポットでフロップをコールした後、SPR は 0.86 まで下がる。
      「SPR < 1」とは「残りスタックがポットより少ない」状態を意味する。
      この状況では通常サイズ (33%, 50%, 75%) は意味を持たない。
      ベットすれば実質 all-in になるため、判断は「プッシュか、チェックか」の2択だけ。
      SRP のターン (SPR≈5) と同じ判断基準を使う誤りを避け、コミット閾値を再設定する。
  - title: "IP ターンのベット判断: push or check"
    summary: |
      IP が push すべきハンド: T1 (HS≥65, TPTK 以上)。
      これはバリューが十分で OOP の広いコール範囲から利益を得られるため。
      T3 (Air 系, HS<40) は SPR < 1 ではブラフ効率が低い。
        理由: OOP が TPTK を持てば equity≈55% で採算コールしてくる。
      M+ (HS 55-64) は状況次第: ボードのテクスチャと相手レンジを考慮する。
      基本方針: 「コールされて損しないハンドのみ push」。
  - title: "OOP ターンの守備: エクイティ計算でコール判断"
    summary: |
      IP が push してきた場合、OOP は必要エクイティ≈46% を基準に判断する。
      TPTK (HS≈65, equity≈60-65%): コール → 期待値+。
      セカンドペア (HS≈40, equity≈35-40%): フォールド → 期待値-。
      コンボドロー (equity≈50-60%): コール圏内。
      実戦での暗算: 「自分のハンドが 50% 以上のエクイティを持つか?」を問う。
      OOP は 4-bet コール時点で「フロップ+ターン push/fold 計画」を持っているべき。
  - title: "ドロー on SPR < 1: 即プッシュの条件"
    summary: |
      SPR < 1 では「ドローをチェックして次ストリートで判断する」余裕がない。
      ターン時点で push/fold を決める必要がある。
      コンボドロー (FD+SD, equity≈50-60%): コール必要エクイティ≈46% を超える → プッシュ可。
      単独 FD (equity≈35%): フォールド (46% に届かない)。
      ただし IP として打つ場合はブラフ push より equity を持ったドローで check が EV+の場合も。
      原則: OOP でのコンボドローはコール。IP でのコンボドローは push/check の両候補。
