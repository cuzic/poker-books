volume: "Vol4"
chapter_num: "10"
title: "SPR と「コミット」の境界"
street: "turn"

summary: |
  SPR < 3 になると「コミット」ゾーン: セット/2ペア以上でないと大ベットを継続できない。
  ターンでのオールイン判断・フォールドエクイティの考え方。

key_formulas:
  "SPR とコミット判断":
    |
    SPR ≥ 6: large SPR → マルチストリート全部使う
    SPR 3-5: medium SPR → 2 ストリートで終わる
    SPR < 3: small SPR → 1 ストリートで commit 完了

    コミットの目安:
      SPR < 3 → HS ≥ 65 (T1) でコミット可
      SPR 3-5 → HS ≥ 75 (2ペア+) でコミット可
      SPR ≥ 6 → HS ≥ 85 (セット+) でコミット可 (top HS のみプッシュ)

  "SPR が下がる速度 (33% × 2)":
    |
    Start: stack=92, pot=10 → SPR=9.2
    After turn 33% call: stack=86, pot=23 → SPR=3.7
    After river 33% call: stack=79, pot=37 → SPR=2.1 (commit zone)

    つまり: SRP で 33% × 2 ベットするだけで SPR < 3 になる
    → リバーでは実質コミットゾーン (3BB ポット対比は small)

  "フォールドエクイティ (FE)":
    |
    FE = 相手がフォールドする確率
    必要 FE (ブラフ成立条件):
      vs 33% barrel: α=25% → FE ≥ 25%
      vs 75% barrel: α=43% → FE ≥ 43%

    SPR < 3 での barrel: FE が低くなりがち (相手はコミット)
    → ブラフ効率が下がる → バリューハンドのみ push

examples:
  - hand: "AA"
    board: "Kc,7d,2s,9h"
  - hand: "77"
    board: "Kc,7d,2s,9h"
  - hand: "AKs"
    board: "Kc,7d,2s,9h"
  - hand: "AQo"
    board: "Kc,7d,2s,9h"
  - hand: "65o"
    board: "Kc,7d,2s,9h"

spr_examples:
  - label: "SRP ターン開始"
    stack: 92
    pot: 10
  - label: "SRP リバー (after 33% × 2)"
    stack: 79
    pot: 37
  - label: "3BP ターン (3bet pot)"
    stack: 70
    pot: 30

gto_reference:
  source: "計算式のみ (GTO測定不要)"
  notes: |
    SPR コミット閾値は GTO で定性的に確認済み。
    実際の push/fold 境界: range_read 30 シナリオから IP が全 in する場面を抽出。

key_points:
  - "SPR < 3 で T1 以上 (HS≥65) が push 対象 → その他はフォールド or チェック"
  - "33% × 2 ベット後にリバーで SPR≈2 → 実質コミット状態"
  - "SPR が下がるほどブラフ効率が悪化 → バリューに絞る"
  - "3BP はターン時点で already medium-small SPR → T1 以上でないと参加不可"
  - "フォールドエクイティが消えたら → チェック/コールが最善になる場合が多い"

sections:
  - title: "SPR < 3 でのアクション変化"
    summary: |
      Large SPR: 3 ストリート全てにベット。ブラフも T3 で機能。
      Small SPR: リバーで 1 ベット入れたらオールイン水域。
      T2/T3 のバリューが消滅: セカンドペアでの push は -EV。
  - title: "コミット閾値の計算"
    summary: |
      コミット = スタックの 50%+ を入れた状態。
      SPR=2 → pot × 2 = 2× スタック。
      リバーで pot size bet → スタック全部 = オールイン。
  - title: "ターンでの commit 判断"
    summary: |
      ターン 33% bet 後: 残り SPR ≈ 3.7。
      フォールドされなければリバーは small SPR。
      → ターンベット前に「リバーでオールインできるか」を問う。
  - title: "フォールドエクイティが低い場面"
    summary: |
      相手が already committed の場合 → ブラフ不成立。
      例: AA on K72 turn 9 (相手が K9 で2ペア) → ブラフは無意味。
      → バリューのみ push する判断が重要。
