volume: "Vol2r"
chapter_num: "09"
title: "マルチストリートプラン"
street: "turn"

summary: |
  フロップで手のカテゴリを決め、ターン・リバーで変化に対応する。
  3ストリートを通じた「プラン」の立て方を整理する。

key_formulas:
  "マルチストリートプランニング":
    |
    フロップ:  5分類を決定
              バリュー/セミブラフ → CBet実行
              BC/RIO → チェックバック
    ターン:   TA+/TA-で継続判断
              カテゴリ変化を確認（FD完成→バリューへ）
    リバー:   α式でV:B比率を守る
              river_tag で閾値調整

  "SPRとコミットライン":
    |
    フロップSPR = スタック / フロップポット
    コミット = SPRに応じた閾値以上のHS
    フロップでコミットライン達成 → 積極的にポット拡大

examples:
  # Plan: バリュー → バレル継続 → リバーベット
  - hand: "AKs"
    board: "Kc,9d,2s,Ah"
  # Plan: セミブラフ → 完成でバリューに変化
  - hand: "JTs"
    board: "Qd,9c,3h,8d"
  # Plan: セミブラフ → 外れ → ブラフバレル判断
  - hand: "JTs"
    board: "Qd,9c,3h,2d"
  # Plan: BC → チェックバック → ターン再評価
  - hand: "KTo"
    board: "Kd,7c,2s,3h"
  # Plan: RIO → チェックバック積極
  - hand: "88"
    board: "Ah,7h,4d,2c"

key_points:
  - "フロップで5分類を確認 → そのカテゴリに沿ったプランを立てる"
  - "セミブラフはターンで完成/外れの二分岐 → 完成=バリュー化、外れ=絞る"
  - "バリューはターンもバレル継続（TA-なら慎重に）"
  - "RIOはストリートが進むほど状況悪化 → 早めのチェックバックで損切り"
  - "マルチストリートでSPRが下がると全ハンドのコミットラインが下がる"

sections:
  - title: "フロップの5分類からプランを決める"
    summary: |
      CBetするかチェックするかはフロップで決まる。
      バリュー/セミブラフ = アグレッシブプラン（ベット/バレル）
      BC/RIO = パッシブプラン（チェック/コール）
  - title: "ターンでのカテゴリ変化"
    summary: |
      セミブラフ完成 → バリューに上昇
      セミブラフ外れ → BC/エアーに低下
      BC + TA+ ターン → アップグレード（小バレル可）
      RIO + FC/SC ターン → さらに悪化（チェック確定）
  - title: "リバーでのα式適用"
    summary: |
      ターンまでのバリュー/ブラフレンジのバランスを保つ。
      river_tag を確認して閾値調整。
      SC/FCリバーは OOP のドンク機会 → IP はチェックが安全。
  - title: "SPR管理とコミットライン"
    summary: |
      各ストリートでポットが増えると SPR が下がり、コミット基準が緩和される。
      フロップで CB + コール → ターン SPR ≈ 2-3 → TPMK でもコミット可能に。

gto_reference:
  source: "GTO Wizard Cash6mGeneral_6mNL25R25 100BB"
  notes: "マルチストリートのバレル頻度: blank=83%、PB=96%"
