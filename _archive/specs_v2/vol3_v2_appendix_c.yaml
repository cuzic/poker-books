volume: "Vol3"
chapter_num: "付録C"
title: "A モデル公式チートシート (1 ページ版)"

summary: |
  実戦で 30 秒以内に参照できる凝縮版チートシートです。
  7 ステップ判定 → MV/DV → TV バンド → α/β/cat/ε の流れをこの 1 枚で完結させます。

sections:
  - type: heading
    level: 2
    text: "統一式 (7 ステップ)"

  - type: prose
    body: |
      ```
      TV = MV[hand] + DV[draw]
      band = air (TV≤2) / weak (3-4) / mid (5-6) / strong (7-8) / nut (9+)

      freq = base[ctx5][band]                  ← Vol2 と共通 (25 セル表)
           + α[ctx13]                          ← コンテキスト補正
           + β[ctx13] · I(TV ≥ 7)             ← 強ハンド補正 (TV≥7 のとき)
           + cat[クラス]                          ← ハンドクラス補正 (slowplay +6 / trash -14 / premium +7)
           + ε[board_family][ctx_group]        ← ボード補正

      freq = clamp(freq, 0.02, 0.98)
      ```

  - type: table
    template: hp_buckets
    title: "MV テーブル"

  - type: table
    template: dp_table
    title: "DV テーブル"

  - type: table
    template: hand_category_table
    title: "ハンドカテゴリ (cat_offset 区分)"

  - type: table
