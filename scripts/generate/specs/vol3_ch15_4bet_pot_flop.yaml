volume: "Vol3"
chapter_num: "15"
title: "4-bet ポットのフロップ戦略"
street: "flop"

summary: |
  4-bet ポットは 3-bet ポットよりさらにチップが入り、SPR が極めて低い (≈1.8)。
  BTN 4-bet (22bb) → BB call → pot=44bb, stack=78bb → SPR ≈ 1.77。
  SPR < 2 では TPTK (T1, HS≥65) でコミットが正当化される。
  IP (4-bettor) はほぼ全フロップで range bet (33% の全ハンド CBet) が最善。
  理由: SPR=2 ではブラフとバリューの区別が薄れ、レンジ全体でプレッシャーをかける方が効率的。
  OOP (caller) はフロップコール後に SPR がターンで 0.85 になる → ターンはほぼ push/fold。
  コンボドロー (FD+SD) はフロップで即プッシュが有利 (フォールドエクイティ + エクイティの合算)。

key_formulas:
  "4-bet ポットの SPR 計算":
    |
    標準的な 4-bet ポット (100BB スタート, BTN vs BB):
      BTN open 2.5bb → BB 3-bet 9bb → BTN 4-bet 22bb → BB call:
        pot = 22 + 22 = 44bb (SB の 0.5bb は無視した簡略計算)
        stack = 100 - 22 = 78bb
        SPR = 78 / 44 ≈ 1.77

    ※ 4-bet サイズ変動による SPR 変化:
      4-bet 18bb: pot=36bb, stack=82bb → SPR ≈ 2.3
      4-bet 22bb: pot=44bb, stack=78bb → SPR ≈ 1.77
      4-bet 28bb: pot=56bb, stack=72bb → SPR ≈ 1.29

    3-bet pot との比較:
      3-bet pot SPR ≈ 4.9  → コミット閾値: TPTK (HS≥65) でバリュー計画
      4-bet pot SPR ≈ 1.77 → コミット閾値: TPTK (HS≥65) でオールイン計画

  "SPR < 2 のコミット判断":
    |
    SPR < 3 → HS ≥ 65 (T1: TPTK 以上) でコミット可
    SPR < 2 → HS ≥ 55 (M+: TPWK 以上) でも実質コミット検討圏

    4-bet pot (SPR≈1.77) フロップ後の SPR 推移:
      フロップ 33% CBet call: pot ≈ 73bb, stack ≈ 63bb → SPR ≈ 0.86
      → ターンは push/fold の判断のみ

  "IP の range bet 戦略 (4-bet ポット版)":
    |
    4-bettor (IP) のレンジ: QQ+, AKs, AQs (ほぼ最強のプレミアムハンドのみ)
    → ほぼ全ボードで IP が強いレンジを持つ
    → 33% の全ハンド CBet (range bet) が GTO 均衡に近い

    理由:
      SPR=2 では相手のポットオッズが良すぎる
        (33% CBet に対し OOP のコール = pot の 25% → 相手は広くコール可能)
      ブラフとバリューを区別して打ち分けるより、全ハンドで統一してプレッシャーをかける方が効率的
      IP のレンジ優位が全ボードで継続 → range bet で全てのエクイティを使う

    CBet サイズ選択:
      dry rainbow board: 33% (range bet, 全ハンド)
      2tone / connected board: 33%〜50% (ドローにチャージ)
      monotone board: 50%〜75% (フラッシュ完成ボードで価値回収)

  "OOP の守備計画 (コール後の SPR 推移)":
    |
    フロップで 33% CBet をコールした後:
      pot ≈ 73bb, stack ≈ 63bb → SPR ≈ 0.86

    SPR < 1 → ターンで push/fold の2択のみ
    必要エクイティ計算:
      pot_odds = stack / (stack + pot) = 63 / (63 + 73) ≈ 46%
      → ターンでコールするには約 46% のエクイティが必要

    OOP コール基準 (フロップ vs 33% CBet):
      HS ≥ 65 (T1: TPTK 以上) → コール計画でターン push/fold
      HS 40-64 (T2: セカンドペア〜TPWK) → ポットオッズ次第でコール候補
      HS < 40 (T3: Air 系) → フォールド (ターンで push できない)

  "コンボドローの push 戦略":
    |
    コンボドロー (FD + SD, 例: JcTc on 9c8c3d):
      エクイティ: vs AA ≈ 55-60% (FD + OESD の合算)
      フォールドエクイティ込み EV:
        push EV = FE × pot + (1-FE) × equity × total_pot
        FE=30%: EV = 0.3 × 44 + 0.7 × 0.57 × 88 ≈ 13.2 + 35.1 = 48.3bb (スタック 78bb)
      → フロップ即プッシュが EV+

    単独ドロー (FD のみ, equity ≈ 35%) の判断:
      push EV = 0.3 × 44 + 0.7 × 0.35 × 88 ≈ 13.2 + 21.6 = 34.8bb (スタック 78bb の約 45%)
      → コールして SPR=0.86 でターン push も選択肢

examples:
  - hand: "AA"
    board: "Kc,7d,2s"
    note: "4-bet pot IP: オーバーペア T1 (HS≈75) → 33% range bet、ターン push 計画"
  - hand: "KK"
    board: "Ac,7d,2s"
    note: "4-bet pot IP: AA/AK に負けているが SPR=2 では 33% range bet (EV+ vs フォールド多数)"
  - hand: "AKs"
    board: "Qc,5d,4c"
    note: "4-bet pot IP: BDFD+over cards → 33% range bet。コール後の SPR 0.86 でターン判断"
  - hand: "QQ"
    board: "Ac,7d,2s"
    note: "4-bet pot IP: オーバーペアではなくなった (A ヒット) → 33% range bet (IP range adv 維持)"
  - hand: "TT"
    board: "Kc,5d,4r"
    note: "4-bet pot IP: HS=42 (オーバーペア低) → range bet 33% で継続 (SPR=2 なら FE 十分)"
  - hand: "JTs"
    board: "9c,8c,3d"
    note: "4-bet pot OOP: コンボドロー (FD+OESD, equity≈57%) → SPR=2 でフロップ即プッシュが最善"

gto_reference:
  source: "GTO Wizard 4-bet pot フロップ解析 + SPR commit theory (SPR < 2 zone)"
  notes: |
    4-bet ポットの IP CBet 頻度 (GTO Wizard BTN vs BB 4-bet pot):
      dry board (K72r): CBet ≈ 95%+ (range bet に近い全頻度)
      wet board (987cc): CBet ≈ 90% (若干の check が残る)

    サイズ分布:
      4-bet pot では 33% が最多 (3-bet pot と同様に small size が中心)
      75% 以上は monotone / combo draw 対抗時のみ

    OOP コール頻度:
      4-bet pot OOP の IP 33% CBet に対するコール ≈ 50-55%
      (SPR が低いためポットオッズが有利 → 広めにコール)

    コンボドロー (FD+SD) の GTO アクション:
      4-bet pot でコンボドローは高頻度でオールイン (raise/push)
      理由: equity が高く、フォールドエクイティ込みの EV が call を上回る

key_points:
  - "4-bet pot SPR ≈ 1.77: TPTK (T1, HS≥65) 以上でフロップコミット計画"
  - "IP は range bet (33% 全ハンド): SPR=2 ではブラフ/バリュー区別が不要"
  - "フロップ 33% コール後: SPR ≈ 0.86 → ターンは push/fold の2択に変わる"
  - "OOP のターンコール必要エクイティ ≈ 46% → T2 以下では参加困難"
  - "コンボドロー (FD+SD) はフロップ即プッシュが最善 (FE + equity の合算が EV+)"
  - "3-bet pot との違い: SPR が半分以下 → コミット閾値がさらに下がる"

sections:
  - title: "4-bet ポットは「別ゲーム」: SPR の違いがすべてを変える"
    summary: |
      SRP SPR ≈ 9、3-bet pot SPR ≈ 5、4-bet pot SPR ≈ 1.77。
      この数値の差が「何ペアでコミットすべきか」を決定的に変える。
      SRP では「セット以上でオールイン」が目安だが、4-bet pot では「トップペア以上」。
      フロップを 1 ストリート消化するだけでターンは SPR < 1 の push/fold ゾーンに突入する。
      まずこの前提を理解し、通常ポットの判断基準をそのまま当てはめる誤りを避ける。
  - title: "IP の range bet 戦略: なぜ全ハンドで打つか"
    summary: |
      4-bettor (IP) のレンジは QQ+/AKs/AQs など premium が集中している。
      ほぼ全フロップで IP がレンジ上の優位を持つため、チェックする理由が薄い。
      SPR=2 では相手がコールしても pot odds が良いため、ブラフを区別して打つより
      全ハンドで統一した 33% を打つ方が OOP の対応を難しくする。
      range bet は「全エクイティを使う」戦略であり、フォールドさせなくても EV+。
  - title: "OOP の守備: コール後の計画が重要"
    summary: |
      OOP は 4-bet をコールした時点でコミット寄りの意思決定を済ませている。
      フロップで IP の 33% CBet をコールした後の SPR は約 0.86。
      ターンは「残りスタックがポットより少ない」状態 → push/fold の2択になる。
      コール基準の核心: ターンで push できるハンドか否かを事前に見極める。
      TPTK 以上なら計画的コール。T2 以下はフロップでフォールドが安全。
  - title: "コンボドロー = 強いプッシュ手"
    summary: |
      FD + SD (例: JcTc on 9c8c3d) はエクイティが 55-60% に達する。
      4-bet pot SPR=2 では「フォールドエクイティ + エクイティ」の合算で即プッシュが EV+。
      フォールドされれば 44bb のポットを獲得。コールされてもエクイティが高いためほぼ互角以上。
      単独 FD (エクイティ≈35%) はターンでの push 継続が計画として成立するためコールも可。
      重要: SPR=2 ではドロー系が「チェックで見せてもらう」より「即プッシュ」が強い。
