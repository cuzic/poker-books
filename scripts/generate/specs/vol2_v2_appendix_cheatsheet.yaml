volume: "Vol2"
chapter_num: "App"
title: "暗算チートシート — 全章まとめ"

summary: |
  本付録は全 12 章の核心公式を 1-2 ページにまとめた横断参照表です。
  実戦中に「あの数値なんだっけ」と迷ったときに参照してください。
  25 セル表・DCBS 表・暗算フロー (6 step + 3-5 step) が 1 か所に集約されています。

