    title: "HP テーブル — 16 hand → 6 バケット"

  - type: table
    template: dp_table
    title: "DP テーブル — 4 段階"

  - type: prose
    body: |
      **CBS バンド (5 区分)**:

      | バンド | CBS 範囲 | 直感的意味 |
      |---|---:|---|
      | air | 0-2 | 役なし / ほぼ改善なし |
      | weak | 3-4 | 弱ペア / gutshot 止まり |
      | mid | 5-6 | 中程度のペア / 強ドロー |
      | strong | 7-8 | トップペア / セット |
      | nut | 9+ | 2 ペア以上の怪物 |

      **低_pair 注意**: HP=2 に分類されるが、context 共通で -10pt 追加補正が入ります。

