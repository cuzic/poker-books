volume: "Vol2r"
chapter_num: "A"
title: "付録: チートシート（5分類版）"
street: "5cat"

summary: |
  本書の全判断フローを1枚に凝縮したチートシート。
  実戦でテーブルに置いて参照できる形式。

key_formulas:
  "ステップ1: 5分類判定":
    |
    → セット/2ペア/OP/TPTK/TPGK? → バリュー
    → FD/OESD/GS (バリューなし)? → セミブラフ
    → TPMK以下 + 2tone/connected? → RIO
    → TPMK以下 + rainbow/dry? → ブラフキャッチャー
    → その他 → エアー

  "ステップ2: ポジション確認":
    |
    IP(CBet権あり):
      バリュー/セミブラフ → CBet
      BC/RIO → チェックバック
      エアー → 型1/型3ドライボードのみCBet
    OOP(CBet権なし):
      CBet受けた → MDF守備
      CR候補: HS≥70 + ウェットボード(型2/型4/型5)

  "ステップ3: ボード型とサイズ":
    |
    型3ロードライ: 100%pot
    型5モノトーン: 75%pot
    型6ペア高強: 75%pot
    それ以外: 33%pot

  "ターン判断 (TA+/TA-)":
    |
    TA+ (PB/OC): バリュー+セミブラフ継続
    TA- (SC/FC): バリュー(HS≥65)のみ継続
    blank: 通常継続 (HS≥20)

  "リバー閾値":
    |
    blank → HS≥55
    OC → HS≥60
    SC/FC → HS≥70
    PB → HS≥80

examples:
  # Quick classification check
  - hand: "AKs"
    board: "Kc,7d,2s"
  - hand: "JTs"
    board: "Qd,9c,3h"
  - hand: "88"
    board: "Ah,7h,4d"
  - hand: "KTo"
    board: "Kd,7c,2s"
  - hand: "A6o"
    board: "Kd,7c,2s"

key_points:
  - "5分類 → ポジション確認 → サイズ決定 の3ステップ"
  - "IPは攻める(CBet)、OOPは守る(チェック/コール)が基本"
  - "ターンはTA+で広げ、TA-で絞る"
  - "リバーはα式でV:B=2:1を守る"

sections:
  - title: "フロップ判断フロー"
    summary: |
      [5分類] → [IP/OOP] → [ボード型] → [サイズ]
  - title: "ターン判断フロー"
    summary: |
      [turn_tag] → [TA+/TA-] → [カテゴリ変化確認] → [バレル/チェック]
  - title: "リバー判断フロー"
    summary: |
      [river_tag] → [IP閾値確認] → [α式V:B] → [OOPドンク判断]
  - title: "HS参照表"
    summary: |
      セット=85、2ペア=72、OP強=80、TPTK=65、TPGK=60
      TPMK=55、TPWK=50、2nd強=42、2nd弱=38、底ペア=30
      FD+36、OESD+28、GS+12、2OC+24
