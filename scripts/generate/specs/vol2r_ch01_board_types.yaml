volume: "Vol2r"
chapter_num: "01"
title: "ボード7分類とエクイティ計算"
street: "flop"

summary: |
  フロップのボードは7種類に分類できる。
  ボード7分類を使って、誰が有利かを素早く判断する。

key_formulas:
  "7分類早見":
    |
    型1 ハイドライ: K/A high + rainbow + spread≥7 (例: A72r)
    型2 ハイウェット: K/A high + 2tone  (例: Ah8h3c)
    型3 ロードライ: 低ランクのみ + rainbow (例: 752r)
    型4 ローウェット: 低ランク + 2tone/connected (例: 987t)
    型5 モノトーン: 全同スーツ (例: Ks7s3s)
    型6 ペア高: 高ペア + X (例: KK7)
    型7 ペア低: 低ペア + X (例: 772)

examples:
  - hand: "AKs"
    board: "Ad,7c,2s"
  - hand: "AKs"
    board: "Ah,8h,3c"
  - hand: "77"
    board: "7d,5c,2s"
  - hand: "JTs"
    board: "9d,8c,7h"
  - hand: "AJs"
    board: "Ks,7s,3s"
  - hand: "AA"
    board: "Kd,Kc,7h"
  - hand: "55"
    board: "7d,7c,2s"

key_points:
  - "型1/型6はIPのCBetが全レンジで有効（ドライ・高ランク主導）"
  - "型2/型4/型5ではドローの存在を意識したサイズ選択（2tone/mono）"
  - "型6/型7ペアボードはIPのレンジが強化 → IP優位"
  - "型3ロードライはIPが100%ポットCBet（小さくベットする必要なし）"

sections:
  - title: "7分類の判定ロジック"
    summary: |
      スーツ分布（mono/2tone/rainbow）・ペアの有無・最高ランク（Q以上=high）・
      スプレッド（≤3=wet）の4要素で型1〜型7を決定する。
  - title: "7分類の特徴と代表例"
    summary: |
      型1〜7のボードが「誰のレンジに有利か」を直感的に理解する。
      型1/6=IPが広くCBet可、型3/4=IPはポーラーCBet、型5=大サイズが基本。
  - title: "ナットアドバンテージとは"
    summary: |
      セット・ストレート・フラッシュ等の最強ハンドを多く持つ側がNA保有。
      通常IP(BTN/CO/SB)がNA保有 → CBetを広く打てる。
      型3ロードライはOOPのNA強化（低カードは BB コール範囲に多い）。
  - title: "エクイティリアリゼーション"
    summary: |
      IP は OOP の 約1.1倍のエクイティを実現できる（ポジションプレミアム）。
      同じ HS でも IP の方が実質有利。

gto_reference:
  source: "GTO Wizard Cash6mGeneral_6mNL25R25 100BB"
  notes: "型3ロードライ: 48%CBet @ 100%pot。型4ローウェット: 56%CBet @ 33%pot"
