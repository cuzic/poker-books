volume: "Vol5"
chapter_num: "06"
title: "ブラフ比率とMDF：攻守の数学的均衡"
street: "river"

summary: |
  リバーは最後の1ベット: 攻撃と守備のどちらも数学的均衡から設計する。
  攻撃 (ブラフ): bluff_freq = α / (1 - α) でバリューとバランスする。
  守備 (MDF): MDF = 1 - α = pot / (pot + bet) でブラフを0EVにする。
  この2式がリバー全戦略の骨格: ブラフ頻度と守備頻度は鏡写しの関係。

key_formulas:
  "ブラフ比率 (V:B比)":
    |
    均衡ブラフ頻度 (相手を indifferent にする):
      bluff_freq = α / (1 - α)
      α = bet_size / (pot + bet_size)

    bet size | α    | V:B 比     | 解釈
    --------|------|-----------|-------
    33% pot | 0.25 | 3:1       | バリュー3 に対してブラフ1
    50% pot | 0.33 | 2:1       | バリュー2 に対してブラフ1
    75% pot | 0.43 | 1.33:1    | バリュー1.3 に対してブラフ1
    100% pot| 0.50 | 1:1       | バリュー1 に対してブラフ1

    ブラフ比率の意味:
      これより少ないブラフ → 相手は fold すべき → ブラフが搾取的に有効
      これより多いブラフ → 相手は always call すべき → バリューが搾取される

  "MDF (最小守備頻度)":
    |
    相手のブラフを 0EV にする最小コール/CR 頻度:
      MDF = 1 - α = pot / (pot + bet)

    bet size | α    | MDF   | 解釈
    --------|------|-------|-------
    33% pot | 0.25 | 75%   | 4分の3 をコール/CR
    50% pot | 0.33 | 67%   | 3分の2 をコール/CR
    75% pot | 0.43 | 57%   | 半分以上コール
    100% pot| 0.50 | 50%   | ちょうど半分コール

    MDF を下回ると: 相手のブラフが +EV → ブラフし放題になる
    MDF を上回ると: 相手のバリューのみを呼ぶ → over-defending (相手に搾られる)

  "攻守の鏡写し関係":
    |
    ブラフ頻度 = α
    守備頻度 = 1 - α = MDF

    α + MDF = 1 (必ず)

    理解の仕方:
      33% bet: α=0.25 → ブラフは25%の頻度、守備は75%の頻度
      50% bet: α=0.33 → ブラフは33%の頻度、守備は67%の頻度

    サイズが大きくなるほど:
      → α が増える (ブラフ比率が増える、守備必要頻度が減る)
      → V:B 比が下がる (バリュー:ブラフ = 1:1 に近づく)

  "実戦での均衡からのズレ":
    |
    相手が MDF を下回る (over-fold):
      → ブラフ頻度を均衡以上に増やせる
      → EV(bluff) > 0 (常に +EV)

    相手が MDF を上回る (over-call):
      → バリューのみベット → ブラフ不要
      → バリューベットが搾取的に有効

    実戦での Over-fold が多い理由:
      リバーは draws なし → 弱いハンドがフォールドしやすい
      大サイズベット → 心理的プレッシャーでオーバーフォールド
      → リバーでのブラフは均衡理論より有利な場面が多い

  "HS ベースのブラフ比率実装":
    |
    バリュー (V): HS ≥ 70 → バリューとしてベット
    ブラフ (B): HS < 35 → ブラフ候補 (ブロッカー条件次第)
    BC (ブラフキャッチャー): HS 35-69 → コールでブラフを捕まえる

    実戦での V:B 比の確認:
      ベットレンジ内: V combo 数 / B combo 数 = α / (1 - α) が目標
      V が多すぎる → ブラフを追加
      B が多すぎる → バリューが薄すぎてベット不可

examples:
  - hand: "AA"
    board: "Kc,7d,2s,9h,3d"
  - hand: "65o"
    board: "Kc,7d,2s,9h,3d"
  - hand: "AKs"
    board: "Jc,Td,5s,9d,2h"
  - hand: "98o"
    board: "Jc,Td,5s,9d,2h"
  - hand: "AQs"
    board: "Ks,7s,5s,3s,8h"

gto_reference:
  source: "river_snap 12 scenarios (2026-05-12 完了)"
  notes: |
    ブラフ比率 = α/(1-α) は数学的定義 (GTO 測定不要)。
    MDF = 1 - α は数学的定義 (GTO 測定不要)。
    GTO 実測での OOP fold rate:
      blank ボード: 25-33% (ほぼ MDF 通り)
      SC ボード (JT59-Q): OOP がリードで先手 → MDF 計算が変わる
      PB ボード: OOP over-fold 傾向 → IP ブラフが有利

key_points:
  - "bluff_freq = α / (1-α): サイズが大きいほど、より多くブラフできる"
  - "MDF = 1 - α: サイズが大きいほど、守備しなくて良い (低 MDF)"
  - "α + MDF = 1: 攻守は必ず鏡写し"
  - "V:B 比: 33%→3:1, 50%→2:1, 75%→4:3, 100%→1:1"
  - "相手の over-fold がある → ブラフ頻度を上げて搾取"

sections:
  - title: "「相手を indifferent にする」という均衡の意味"
    summary: |
      GTO の目標: 相手がコールしてもフォールドしても EV が変わらない状態 = indifferent。
      攻撃側がブラフ頻度を正確に設定 → 守備側はどちらを選んでも同じ結果。
      実戦では相手が均衡から外れる (over-fold or over-call) → exploitative に対応。
  - title: "V:B 比の管理"
    summary: |
      自分のベットレンジに含まれるバリュー combo とブラフ combo を数える。
      33% bet を選ぶなら: バリュー3に対してブラフ1 が均衡。
      50% bet を選ぶなら: バリュー2に対してブラフ1 が均衡。
      「サイズを大きくすると、より多くのブラフを混ぜて良い」。
  - title: "MDF から守備頻度を決める"
    summary: |
      vs 50% bet: MDF=67% → 自分のレンジの67%をコール/CR。
      全コールレンジの HS を並べ、上位 67% をコール候補とする。
      下位 33% (HS が低いハンド) をフォールド → ちょうど MDF を満たす。
  - title: "リバーで均衡が崩れやすい理由"
    summary: |
      ドローなし → 弱いハンドのコール価値がフロップより低い。
      心理的プレッシャー → 大サイズに対してオーバーフォールドしやすい。
      → 実戦ではブラフ頻度を上げ、守備頻度を下げる調整が必要なことが多い。
