volume: "Vol2"
chapter_num: "00"
title: "はじめに — 暗算 5 秒でフロップを制する"

summary: |
  本書のテーマは「Cash 100bb のポストフロップ判断を暗算 5-7 秒で完了する」ことです。
  CBS (Combined Board Score) という 1 本の数値と 25 セル表を使えば、フロップのベット判断を反射的に下せるようになります。
  本章では Vol2 の目標・主役システム・12 章の構成・Vol1 (プリフロップ) および Vol3 (MTT Full) との関係を説明します。

sections:
  - type: heading
    level: 2
    text: "なぜポストフロップで迷うのか"

  - type: prose
    body: |
      ポーカープレイヤーがポストフロップで迷う原因は、大きく 2 つに分類できます。

      第 1 の原因は「ハンドの強さがわからない」ことです。フロップを見てとっさに「このハンドは強いのか弱いのか」を判断できないと、ベットするかチェックするかすら決められません。エクイティ計算が頭の中でできないため、判断が止まってしまいます。

      第 2 の原因は「打つべきか打たないべきかわからない」ことです。ハンドの強さはわかっていても、「このボードでこのハンドはベットすべきか」という判断が難しいのです。GTO ソルバーの出力は膨大で、実戦中に参照できるものではありません。

      本書はこの 2 つの問いに、CBS という 1 本の数値と 25 セル表という道具で答えます。CBS でハンドの強さを数値化し、25 セル表でベット頻度の目安を引く。この 2 ステップを身につければ、5-7 秒以内に判断を完了できます。

  - type: heading
    level: 2
    text: "本書の主役 — Light UCBS v2 と Light DCBS"

  - type: prose
    body: |
      本書で使う計算システムは 2 つあります。

      **Light UCBS v2** は、フロップで cbet を打つかどうかを決めるための攻撃側システムです。CBS (Combined Board Score) を計算し、5 つの context (状況) と 5 つの CBS バンド (強さ区分) から成る 25 セル表に照らしてベット頻度の目安を得ます。頻度が 50% 以上ならベット推奨、50% 未満ならチェック寄りと判断します。

      **Light DCBS** は、BB が cbet を受けたときに fold するか continue するかを決めるための守備側システムです。HP (Hand Power) の値と context に応じた continue freq (コール + レイズの合計頻度) を参照し、50% 以上なら continue、50% 未満なら fold を選択します。

      この 2 つのシステムを組み合わせると、フロップでの攻守両面の判断が暗算で完結します。攻撃 (cbet 判断) に Light UCBS v2 を使い、守備 (cbet を受けたときの判断) に Light DCBS を使います。

  - type: heading
    level: 2
    text: "暗算フロー 6 ステップの全体像"

  - type: prose
    body: |
      Light UCBS v2 の計算は以下の 6 ステップで完了します。手慣れると 5-7 秒で判断を終えられます。

      **Step 1: HP 確認** — フロップでの役の種類を確認し、HP テーブルから HP 値 (2/3/5/7/8/9) を読む。

      **Step 2: DP 確認** — フロップでのドロー種別を確認し、DP テーブルから DP 値 (0/1/2/3) を読む。

      **Step 3: CBS 計算** — CBS = HP + DP を計算する。

      **Step 4: CBS バンド判定** — CBS 値を 5 段階のバンド (air/weak/mid/strong/nut) に分類する。

      **Step 5: 25 セル表を参照** — context (cash/mtt_short/mtt_deep/3bp/turn) とバンドを確認し、ベット頻度の目安を読む。

      **Step 6: 判断** — 頻度 ≥ 50% ならベット推奨、< 50% ならチェック寄り。low_pair なら -10pt の補正を加えてから判断する。

  - type: heading
    level: 2
    text: "25 セル表の概要"

  - type: table
    template: 25cell_table
    title: "Light UCBS v2 — 5 context × 5 バンドのベット頻度目安"

  - type: prose
    body: |
      Cash context (Cash 100bb SRP) が本書のメインです。strong/nut バンドは 60% でベット推奨、air/weak/mid バンドは 40-45% でチェック寄りというシンプルな構造です。

      3bp context (3-bet pot) は SPR が約 5 と低く、weak/mid バンドもベット推奨に転じます。turn context (ターン 2nd barrel) は全バンドが大幅低下し、nut でも 40% と控えめです。

      詳細は ch02 (25 セル表の読み方) と ch03 (Cash 100bb 実戦ガイド) で解説します。

  - type: heading
    level: 2
    text: "読み方ガイド — 12 章の構成"

  - type: prose
    body: |
      本書は 12 章 + 付録で構成されています。各章の対応関係は以下の通りです。

      **ch01-02: 基礎計算** — CBS = HP + DP の計算方法 (ch01) と 25 セル表の読み方 (ch02) を習得します。ここが本書の土台です。

      **ch03-04: Cash 実戦** — Cash 100bb SRP での cbet 完全ガイド (ch03) とボード読み・型1-7 分類 (ch04) を学びます。代表的なボード 5 問で実践的な計算フローを体得します。

      **ch05-06: 補正** — ベットサイズ (33% vs overbet、ch05) とポジション補正 pos_lift (ch06) を学びます。SB は -8pt、CO/HJ は +10pt という具体的な数値を扱います。

      **ch07: 3-bet pot** — SPR ~5 の特殊状況での Light UCBS 適用 (ch07) を学びます。コミット判断が近い 3bp context の特徴を理解します。

      **ch08: 守備** — Light DCBS による OOP の fold/continue 判断 (ch08) を学びます。HP 別 continue freq 表を使って 3-5 秒で守備判断を完了します。

      **ch09-10: ターン〜マルチストリート** — ターン 2nd barrel の α=-0.35 シフト (ch09) と 3 ストリート連携の設計 (ch10) を学びます。

      **ch11: 例題集** — Cash 100bb の代表 20 スポットで暗算フロー全体を練習します。

      **付録: チートシート** — 全公式・全表を 1-2 ページに集約した実戦参照シートです。

  - type: heading
    level: 2
    text: "Vol1 (プリフロップ) との関係"

  - type: prose
    body: |
      Vol1 では Cash および MTT のプリフロップ判断を「Score = H + L + suit + pair - gap」という式で暗算しました。本書 Vol2 ではポストフロップに移ります。

      Vol1 の Score 式と本書の CBS は完全に独立した別概念です。Vol1 の H・L はカードランクを表しますが、本書の HP (Hand Power) はフロップでの役の強さを表します。名前が似ていますが意味が異なります。

      本書は Vol1 を読んでいなくても独立して理解できます。ただし、「なぜオープンできる手でフロップが弱いのか」という疑問には Vol1 の説明が役立ちます。例えば Vol1 で Score が高く評価されたスーテッドコネクターも、フロップで役なしなら HP=2 (air) として扱います。

  - type: heading
    level: 2
    text: "Vol3 (MTT Full) および Vol5 (エクスプロイト) との関係"

  - type: prose
    body: |
      **Vol3 との関係**: Vol3 は本書と同じ CBS = HP + DP 計算を使いますが、context の粒度が異なります。本書は 5 context に絞った簡易版 (Light) です。Vol3 は 13 context の完全版 (Full UCBS-v2) を使い、より細かいスタック別・場面別の判断を扱います。まず本書で CBS の基礎と Cash 100bb の感覚をつかんでから、Vol3 で MTT 特有の状況に対応することを推奨します。

      **Vol5 との関係**: Vol5 では相手タイプ別の読みと補正を扱います。本書で学ぶ CBS と 25 セル表は GTO に基づいた基準値です。Vol5 では「相手がルーズな場合は CBS 閾値を上げる」「相手がタイトな場合は air でもブラフが通りやすい」という補正を加えます。本書の基準値を体得していることが Vol5 の前提となります。
