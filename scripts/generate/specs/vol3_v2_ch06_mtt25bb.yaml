  - type: heading
    level: 2
    text: "まとめ：mtt_25bb の 5 原則"

  - type: prose
    body: |
      mtt_25bb context を実戦で使うための 5 原則をまとめます。

      1. **強い役（セット/ストレート/フラッシュ）はチェック優先**: off_slowplay=-28pt が指示する GTO の傾向。相手を引きつける slowplay が有効。
      2. **トップペア/オーバーペアは積極的 bet**: β=+31pt で CBS≥7 の役に大幅 lift。特に BTN/CO では高頻度 bet。
      3. **ロー・ポケットペアは慎重に**: off_trash=-23pt で弱いペアは bet 頻度を下げる。ボードがドライで相手が fold しやすい場合のみ bet 検討。
      4. **SB は BTN より -10pt**: OOP のため全ハンドで bet 頻度を控えめに設定。
      5. **Aハイドライ/ペアボードでは range bet**: ax_range_bet=+30pt が有効な条件（BTN/CO + gap≥8 or paired）を確認してから適用。
