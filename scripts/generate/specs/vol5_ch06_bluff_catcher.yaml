volume: "Vol5"
chapter_num: "07"
title: "ブラフキャッチャー：コールの技術"
street: "river"

summary: |
  ブラフキャッチャー (BC) = 相手のバリューには負けるが、ブラフには勝てるハンド。
  M- バケット (HS 35-54) がメインのブラフキャッチャー候補。
  コール判断: 相手のバリュー:ブラフ比とポットオッズを比較する。
  相手がブラフを含む場合に限り、M- でのコールが +EV になる。

key_formulas:
  "ブラフキャッチャーの定義":
    |
    ブラフキャッチャー (BC) = HS が相手のバリューレンジより低いが
                               相手のブラフには勝てるハンド

    実装:
      自分の HS < 相手の V バケット下限 (70): バリューには負ける
      自分の HS > 0: ブラフ (air/HS<35) には勝てる

    M- (35-54) はほぼ全てがブラフキャッチャー:
      TPWK (50): 相手のナッツより弱い → BC
      セカンドペア (38-42): BC の典型例

  "コール収支計算":
    |
    相手の ベットレンジ: V combo = v, Bluff combo = b
    コール収支 (EV):
      EV(call) = b/(v+b) × pot - v/(v+b) × bet
      EV > 0 なら コール が +EV

    コールが有利な条件:
      b/(v+b) > α (= bet/(pot+bet))
      ブラフ比率 > ポットオッズ (α)

    例 (vs 50% bet, α=0.33):
      相手が V:B = 2:1 → ブラフ比率 33% = α → indifferent (コール/フォールド均衡)
      相手が V:B = 1:1 → ブラフ比率 50% > 33% → コール +EV
      相手が V:B = 3:1 → ブラフ比率 25% < 33% → フォールド +EV

  "ブラフキャッチャーの選択":
    |
    最良 BC (コール価値が高い):
      相手のブラフに勝ち、かつナッツブロッカーを持つ:
        例: Ax on flush board → ナッツフラッシュをブロックしながら
            相手の low bluff に勝てる

    次点 BC:
      単純に相手のブラフより強いハンド (mid pair 等)

    コールすべきでない:
      HS < 35 (B バケット): 相手のブラフにも負ける可能性大
      HS ≥ 70 (V バケット): BC ではなくバリューとして機能 → bet or raise

  "ボードタイプ別 BC 判断":
    |
    blank ボード:
      IP がベット → 相手レンジに M+ (TPTK 等) も多い
      OOP の M- は BC として機能: TPWK (50) でコール可
      threshold: vs50% → HS ≥ 42 でコール (第4章 ch08 参照)

    SC ボード:
      IP の M+ はチェック → IP のベットレンジがポーラー化 (V or B)
      OOP の M- での BC コール: ブラフ比率が高くなる → コール価値 UP
      TPWK (50) でも SC ボードなら IP ベットに対してコール検討

    FC ボード:
      SC と同様: IP の M+ はチェック → ベットレンジがポーラー
      フラッシュがない M- でも IP ブラフを捕まえるためコール

    PB ボード:
      IP のベット = FH/Trips 多め → バリューが濃い
      M- での BC コールは危険 → フォールドが多い

  "GTO ブラフキャッチャー原則":
    |
    相手のベットレンジを推定:
      1. IP が SC/FC でベットした → レンジがポーラー (V or B)
         → ブラフ比率高 → BC コールが有利
      2. IP が blank でベットした → レンジが merged (V + M+ + B)
         → ブラフ比率低 → BC はギリギリコール
      3. IP が PB でベットした → V 主体 → BC フォールドが多い

    BC の混合戦略:
      全ての BC をコールする必要はない
      ポットオッズと相手のブラフ比率が等しくなるよう频度を調整

examples:
  - hand: "AQo"
    board: "Kc,7d,2s,9h,3d"
  - hand: "T9s"
    board: "Kc,7d,2s,9h,3d"
  - hand: "AQo"
    board: "Jc,Td,5s,9d,2h"
  - hand: "KQo"
    board: "Jc,Td,5s,9d,Qh"
  - hand: "AQs"
    board: "Ks,7s,5s,3s,8h"

gto_reference:
  source: "river_snap 12 scenarios (2026-05-12 完了)"
  notes: |
    SC ボードでの IP ベットレンジ: TPTK bet 42% (SC=JT59-Q) →
      IP のベットレンジが partial: V + mixed M+ + some B
      → OOP の BC コール判断は複雑。
    blank ボードでの IP bet rate: TPTK 62-99% →
      IP のベットレンジが merged (thin value 多め) → ブラフ比率低い。
    PB ボードでの IP bet: TPTK 0% → IP ベット = Trips/FH ほぼ確定。
    → OOP の M- は PB でコールが危険 (ブラフ比率が極低)。

key_points:
  - "BC = バリューに負けるがブラフに勝てるハンド: M- (35-54) が主役"
  - "コール条件: 相手のブラフ比率 > α (ポットオッズ)"
  - "SC/FC ボードで IP がベット: ポーラーレンジ → ブラフ比率高 → BC コール有利"
  - "PB ボードで IP がベット: V主体 → ブラフ比率低 → BC フォールドが多い"
  - "ナッツブロッカー保有 BC が最良: 相手のナッツを阻害しながらブラフを捕まえる"

sections:
  - title: "ブラフキャッチャーとは何か"
    summary: |
      ショーダウンで勝ち負けが「相手が何を持っているか」によって決まるハンド。
      BC は「ショーダウンに行く価値はあるが、ベットするとバリューが出ない」。
      M- (35-54) のほとんどが BC: TPWK、セカンドペア → コールで価値を出す。
  - title: "コール vs フォールドの数学"
    summary: |
      相手のベットレンジのブラフ比率と α (ポットオッズ) を比較する。
      ブラフ比率 > α → コール +EV。
      ブラフ比率 < α → フォールド +EV。
      相手が V:B=2:1 で vs50% → ちょうど indifferent (どちらでも均衡)。
  - title: "ボードタイプで変わる BC 判断"
    summary: |
      SC/FC: IP のベットがポーラー → ブラフ比率UP → BC コールが積極的に有利。
      blank: IP のベットが merged → ブラフ比率低 → BC はギリギリコール。
      PB: IP のベットが V主体 → ブラフほぼゼロ → BC フォールド。
  - title: "M+ とブラフキャッチャー: 混同しない"
    summary: |
      M+ (55-69) は blank で「バリュー」としてベット (ch03 参照)。
      M- (35-54) は blank でも BC としてコール待機。
      「ベットして価値を取る」vs「コールしてブラフを捕まえる」は異なる戦略。
      M+ がチェックバックした場面で M- がコールする → セーフティネット。
