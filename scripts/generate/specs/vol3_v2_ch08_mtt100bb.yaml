volume: "Vol3"
chapter_num: "08"
title: "MTT 100bb 序盤 cbet——wide cbet の特殊性"

summary: |
  MTT 序盤の 100bb（SBR 約 80-100）は最も独特なコンテキストです。
  α=+15pt という突出した値と wide lift=+17pt が「全体的に広く積極的に bet する」戦略を示します。
  しかし WRMSE 21.95% という精度の低さは、このコンテキストを「信頼度低めで使う」シグナルです。
  本章では精度の限界を率直に示しながら、mtt_100bb の正しい使い方を解説します。

sections:
  - type: heading
    level: 2
    text: "mtt_100bb context の特徴——α=+15 という異常値"

  - type: prose
    body: |
      mtt_100bb のパラメータ一覧を確認しましょう。

      | パラメータ | 値 | MTT 系列比較 |
      |---|---:|---|
      | α（全体 lift） | **+15pt** | 最大（25bb: +6, 50bb: -4, 200bb: -4） |
      | β（CBS≥7 追加 lift） | **+9pt** | 最小（25bb: +31, 200bb: +11） |
      | off_slowplay | **-17pt** | 中程度 |
      | off_trash（low_pair） | **-19pt** | 小さめ |
      | off_premium（overpair/underpair） | **+8pt** | 最小（50bb: +20） |
      | SB lift | **-11pt** | 小さめ（200bb: -34） |
      | wide lift（CO/HJ/UTG） | **+17pt** | 最大（25bb: +13） |
      | A-x range bet | **+28pt** | 大きい（50bb: +11） |

      WRMSE = **21.95%**——この値に注目が必要です。

      α=+15pt は「すべてのハンドで 15pt 積み上げ」を意味します。
      例えば MID confidence、bet 方向（base_freq 40%）の top_pair が BTN から bet する場合、
      α だけで 40% + 15% = 55% の基礎頻度になります（他の補正は別途加算）。

  - type: heading
    level: 2
    text: "WRMSE 21.95% の問題——精度が低い理由"

  - type: prose
    body: |
      mtt_100bb は MTT depth 系列の中で**唯一の「精度注意（20%+）」context** です。

      精度が低い主な理由は **MTT6mSimple tree の wide cbet 特性**です。

      MTT6mSimple は GTO Wizard の「シンプルなゲームツリー」を使った解析モデルです。
      このモデルでは 100bb 付近において以下の特異な挙動が観察されました。

      1. **ベットサイズが偏る**: Simple tree は 33% と 116% の 2 サイズしか許容しないため、GTO が「どちらかを選ぶ」際に極端な頻度振り分けになる。
      2. **Wide cbet が顕著**: 100bb では特に「ほぼすべてのハンドで 33% bet」という傾向が見られ、通常の polarize 戦略から外れる。
      3. **UCBS-v2 の構造と合わない**: UCBS-v2 の CBS-based な判断とこの wide cbet パターンがマッチしにくい。

      **実戦での対処**:
      WRMSE 20%+ は「±20pt の誤差が発生しうる」という意味です。
      mtt_100bb では以下のアプローチを推奨します。

      - 計算結果を「方向の参考」として使い、exact な頻度には依存しない
      - 特に境界値（40-60%）付近は「どちらでも良い」として処理する
      - WRMSE が低い mtt_50bb との比較で「どちらに近い判断をするか」を参考にする

  - type: heading
    level: 2
    text: "Wide lift +17pt——序盤ほど広くベットする理由"

  - type: prose
    body: |
      mtt_100bb の wide lift = **+17pt** は MTT depth 系列の最大値です（25bb: +13pt、200bb: +1pt）。

      これは CO/HJ/UTG ポジション（広いレンジからオープンするポジション）が BTN より +17pt 高い bet 頻度を採用することを意味します。

      **序盤の wide cbet が成立する条件**:

      1. **ICM プレッシャーが小さい**: ゲーム序盤は賞金圏には遠く、チップ EV ≈ ドル EV です。ICM を恐れずに積極的に bet できます。
      2. **スタックが深い**: 100bb では大きな bet を受けても call/raise で対応できる余地が大きく、相手も簡単には fold しません。
      3. **レンジが広いほど bet が多い**: UTG など tight なレンジからのベットは「強い役を持っている」と示せますが、GTO では CO/HJ も積極的 bet 戦略を取ります。

      **注意**: この +17pt はあくまで 100bb での値です。
      スタックが減るにつれてこの補正は縮小し（200bb では +1pt まで落ちる）、
      deep stack では position による差が小さくなる傾向があります。

  - type: heading
    level: 2
    text: "A-x range bet +28pt の活用"

  - type: prose
    body: |
      mtt_100bb の ax_range_bet = **+28pt** は、Aハイボードへの積極的アプローチを示します。

      適用条件:
      - ポジション: BTN または CO
      - ボード条件: A-high かつ（paired か gap ≥ 8）
      - 例: A♠4♦2♣（gap=10 ≥ 8 → 適用）、A♠K♦Q♣（gap=2 < 8 → 非適用）

      mtt_100bb での +28pt は 25bb（+30pt）と同等の大きな値です。
      序盤 100bb の MTT では Aハイのドライ/ペアボードで BTN/CO が積極的 range bet する戦略が GTO とされています。

      これはチップ EV の最大化が優先される序盤ならではの攻撃的スタイルです。

