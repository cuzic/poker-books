  - type: heading
    level: 2
    text: "WRMSE 21.95% の告知——精度限界の説明"

  - type: prose
    body: |
      mtt_100bb は UCBS-v2 フレームワークの中で最も注意が必要な context の一つです。

      WRMSE 21.95% が意味することを具体的に示します。

      - 予測頻度が 60% の場合、実際の GTO 頻度は 38%-82% の幅に分布しうる
      - 特に middle hand（second_pair/underpair/ace_high）では誤差が大きい
      - セット/オーバーペア/ノーメイドハンドの両極端は比較的精度が高い傾向

      **推奨使用方法**:
      1. **方向判断のみ**: bet か check か の方向を決める参考として使う
      2. **強い手は信頼**: CBS ≥ 8（セット以上）か CBS ≤ 2（エアー）は比較的正確
      3. **境界値は捨てる**: 40-60% の結果が出たら「mixedでよい」と判断する
      4. **比較参照**: mtt_50bb（WRMSE 12.96%）との差を見て MTT 中盤との比較で判断する

      この精度限界を理解した上で使えば、mtt_100bb は MTT 序盤の**方向判断ツール**として十分に機能します。

  - type: heading
    level: 2
    text: "まとめ：mtt_100bb の 5 原則"

  - type: prose
    body: |
      mtt_100bb context を実戦で使うための 5 原則をまとめます。

      1. **WRMSE 21.95% を認識**: 計算結果は「方向の参考」。exact な頻度には依存しない。
      2. **α=+15pt で全体的に積極的**: 全ハンドで +15pt の基礎が加算。序盤の wide cbet 特性を反映。
      3. **wide lift +17pt**: CO/HJ/UTG でさらに +17pt。広いレンジからも bet が多い序盤の特徴。
      4. **SB の抑制は小さい（-11pt）**: 200bb の -34pt と比べて SB でも bet しやすい。
      5. **A-x range bet +28pt を活用**: ICM が小さい序盤の Aハイドライ/ペアボードは積極的 bet。
