volume: "Vol2r"
chapter_num: "07"
title: "ターンバレル: TA+/TA- とサイズの二極化"
street: "turn"

summary: |
  ターンバレルは「ターンカードでレンジ優位がどちらに傾くか」で決まる。
  TA+/TA- 二項判定でハンド選択を決め、サイズは 100% pot 通常 / 276% pot 極化の二極化を使う。
  GTO Wizard 実測 268 spots を根拠に、サイズと頻度の境界を確定する。

key_formulas:
  "TA+/TA- 二項判定 (IPのバレル判断)":
    |
    TA+ (IP のレンジ優位が増加 → 広くバレル):
      - 2nd ペアターン (Kxx → 7 等)
      - 3rd ペアターン (Kxx → 2 等)
      - K-高ボード以上の "broadway" オーバーカード (Kxx → T/J/Q)
      - AK系ボードの top-pair (AK4 → A や K)

    TA- (相手のレンジが追いつく/勝つ → チェック):
      - 1st ペアターン (Kxx → K 等)
      - Q/J/T-高ボードの top-pair (QJ4 → Q 等)
      - 強いストレート/フラッシュ完成
      - low blank ターン (BB がペアしやすい中ランク)

  "ターンバレル サイズ二極化 (268 spots 実測)":
    |
    100% pot (regular overbet):
      - dry high board + mid blank turn (Kxx + 4,5,6,8,9)
      - wet connected (987, T76, JT9, mono)
      - 「相手がドローを持ちうる」spot で標準バレル

    276% pot (huge overbet):
      - dry high board + broadway turn (Kxx + T/J/Q)
      - dry high board + low blank turn (Kxx + 3)
      - QJ4 / KQ4 / A42 等の dry concentrated 板
      - 「極化レンジ」spot

    157% pot (mid overbet):
      - AK4 系 range advantage 強い IP

    重要: MTT6mSimple precomputed tree では 33% pot turn cbet サイズは存在しない。
    旧 GCP study の「33% 主流」はフロップ cbet の話。

  "バレル頻度 (Kxx 板 turn card 別、TA+/TA- 判定済み)":
    |
    Kxx + 3 (low blank) : 28% bet (276% sz)
    Kxx + 4 (low blank) : 31% bet (101% sz)
    Kxx + 5 (mid blank) : 30% bet (101% sz)
    Kxx + 6 (mid blank) : 31% bet (101% sz)
    Kxx + 8 (mid blank) : 35% bet (101% sz)
    Kxx + 9 (mid blank) : 37% bet (101% sz)
    Kxx + T (broadway) : 32% bet (276% sz)
    Kxx + J (broadway) : 35% bet (276% sz)
    Kxx + Q (broadway) : 32% bet (276% sz)
    Kxx + A (overcard) : 52% bet (101% sz)

    全体観: 板を問わず IP は 25-52% でバレル。サイズ選択が重要。

examples:
  # TA+ 2nd pair turn
  - hand: "AKs"
    board: "Kc,7d,2s,7h"
  # TA+ 3rd pair turn
  - hand: "AKo"
    board: "Kc,7d,2s,2h"
  # TA- 1st pair turn
  - hand: "AKs"
    board: "Kc,7d,2s,Ks"
  # broadway turn (TA+)
  - hand: "AKs"
    board: "Kc,7d,2s,Qh"
  # AK系 top pair turn (TA+ EXTREME)
  - hand: "Ah4s"
    board: "Ah,Kd,4s,Ac"
  # AK系 mid pair turn (TA+ EXTREME)
  - hand: "AhKd"
    board: "Ah,Kd,4s,Kc"
  # wet connected blank
  - hand: "9c8h"
    board: "9h,8s,7d,4c"
  # SC turn (ストレート完成)
  - hand: "AKs"
    board: "Jd,Tc,9s,8c"

key_points:
  - "TA+/TA- 判定は『相手のレンジがそのターンで強化されるか』を考える"
  - "2nd/3rd ペアターンは BB のレンジに少ない → TA+"
  - "1st ペアターン (K-high → K) は BB の Kx も強化 → TA-"
  - "ターンバレル サイズは 100% (通常) / 276% (極化) の二極化"
  - "broadway ターン (Kxx + T/J/Q) は極化サイズ、mid blank は通常サイズ"
  - "AK4 + A/K turn は 70-86% で OOP もドンク (extreme TA+)"
  - "33% pot 通常サイズはターン cbet で使われない (MTT6mSimple)"

sections:
  - title: "ターンバレルの本質的な問い"
    summary: |
      「このターンカードで IP のレンジは BB のレンジに対して優位になるか」
      強くなる = バレル有効、弱くなる = チェック。
      フロップ cbet を打った時点とターン時点ではレンジが違う。
      BB が flop call で残したレンジは HS≥35 中心 → ターン判断はより慎重。

  - title: "TA+/TA- 二項判定の境界"
    summary: |
      TA+: 2nd/3rd pair turn, broadway overcard (K-high以上), AK系 top/mid pair
      TA-: 1st pair turn (top card), 2nd-tier overcard (Q/J/T board の top pair), ストレート完成, low blank
      境界例: QJ4 + Q は TA- (IP も Q 多)、AK4 + A は TA+ (BB に A 少)
      → 「板上での該当 rank の希少性」で TA+/TA- が決まる

  - title: "サイズ二極化: 100% vs 276%"
    summary: |
      標準: 100% pot overbet — wet board や mid blank turn
      極化: 276% pot — dry board + broadway turn または low blank turn
      AK4 系: 157% pot (中間 overbet)
      33% pot は MTT6mSimple tree に存在しない (フロップ cbet とは別物)
      サイズ大 → IP のレンジが nutted/air に極化
      サイズ中 → IP が連続バリュー打ち

  - title: "ターンカード別バレル率の実測表"
    summary: |
      Kxx 板の全 turn card で IP のバレル率は 28-52% に収束
      最低: Kxx + 3 (28%, 極化)
      最高: Kxx + A (52%, regular)
      → ターンを問わず「バレルか check か」は半々、サイズ選択が決定的

  - title: "AK 系 board の特殊性 (EXTREME TA+)"
    summary: |
      AK4 + A や AK4 + K でのバレルは 70-86% に達する
      理由: A/K 板で IP は AA/KK/AKs/AKo を非対称に保持 → ペア turn で nut が確定
      OOP もこの板では donk 70% 以上 (両者の range overlap が極端に薄い)

gto_reference:
  source: "GTO Wizard MTT6mSimple @200bb 268 spots (2026-05-26)"
  notes: |
    主要発見:
    1. Turn IP cbet サイズは 101%/157%/276% の三層構造 (33% は存在しない)
    2. Kxx + (4-9, A) → 101%、Kxx + (3, T, J, Q) → 276%
    3. AK4 板 → 157% mid overbet
    4. Wet connected (987, T76, JT9, mono) → 101%
    5. IP barrel 頻度は board × turn card で 25-52%
