  - type: heading
    level: 2
    text: "各部のポイント解説"

  - type: prose
    body: |
      **部 1 解説 (Light UCBS v2)**:

      問 1〜5 (strong/nut バンド): top_pair・overpair・set・two_pair・flush はいずれも CBS 7+ で strong または nut バンドに入ります。
      cash context の strong (60%) / nut (60%) が適用されます。
      GTO との差は ±5-10pt 程度で Light v2 WRMSE ~19% の範囲内です。

      問 6〜10 (mid/air バンド): second_pair+fd は CBS=7 (HP=5+DP=2) で strong バンド (60%) になります。
      ドローが強いと CBS が上がり、ベット推奨になる典型例です。
      underpair+gutshot は CBS=4 (HP=3+DP=1) で weak バンド (40%) → チェック寄り。
      ace_high+oesd は CBS=4 (HP=2+DP=2) で weak バンド (40%) → チェック寄り。
      low_pair は HP=2 でエアーバンドに加え -10pt 補正 → 35% → チェック推奨。
      no_made_hand+combo_draw は CBS=5 (HP=2+DP=3) で mid バンド (40%) → チェック寄り。

      **部 2 解説 (Full UCBS-v2)**:

      Full UCBS-v2 では board テクスチャ (polarize判定)・confidence (CBS とthreshold の距離)・size (33% or 116%) が加わります。
      K72r は型1 ドライ → polarize ボード → size=116%。
      T98s は型4 連結 → non-polarize → size=33%。
      Light v2 との差: K72r の top_pair は Light 60% vs Full では confidence・α補正で異なる値になります。
      Full v2 は精度 WRMSE 16.43% (Light ~19%) と 2-3pt 精度が高い代わりに計算が複雑です。

      **部 3 解説 (Light DCBS)**:

      ace_high (HP=2) は 40%+5pt=45% → fold 寄り (境界判断)。
      underpair (HP=3) は 85% → call 推奨。
      second_pair (HP=5) は 98% → virtually always call。
      top_pair (HP=7) は 100% → 必ず continue (call or CR)。
      no_made_hand (HP=2) は 40%-3pt=37% → fold 推奨。

      3 フレームワーク比較:
      Light v2 は「打つか打たないか」を 60 秒 5 秒で決める。
      Full v2 は「何% の頻度で打つか」を厳密に計算する。
      DCBS は「守備側の続けるか畳むか」を HP から素早く判断する。

  - type: heading
    level: 2
    text: "GTO との精度比較"

  - type: prose
    body: |
      本章の例題に使った各フレームワークの精度参考を示します。

      | フレームワーク | 対象 | WRMSE (参考) | 暗算時間 |
      |---|---|---:|---:|
      | Light UCBS v2 | IP cbet freq | ~19% | 5-7 秒 |
      | Full UCBS-v2 | IP cbet freq | 16.43% | 15-30 秒 |
      | Light DCBS | OOP continue freq | ~15% | 3-5 秒 |

      **解釈**:
      Light v2 は Full v2 より 2-3pt 誤差が大きいですが、暗算 5 秒以内の代償として許容できます。
      DCBS はシンプルな HP テーブル参照のみで精度 15% 前後を達成しています。
      境界ハンド (CBS=5-6 の mid バンド) では 3 フレームワークとも判断が難しく、GTO に近づけるには Full v2 を使います。

      **cash 100bb での境界ハンド**:
      - second_pair (HP=5): Light 40% vs GTO ~35-45% (ボード依存)
      - underpair (HP=3): Light 40% (weak) vs GTO ~30-50% (ターン計画依存)
      - ace_high + draw: Light は CBS 合計で判断、GTO はドロー具体的な equity で判断

      **推奨ワークフロー**:
      実戦では Light v2 (5 秒判断) を使い、学習時は Full v2 で精密計算を確認します。
      月 1 回程度、GTO Wizard で代表ボード 10 スポットを確認することを推奨します。

  - type: heading
    level: 2
    text: "turn context の追加例題 (問 19-20)"

  - type: examples
    framework: light
    title: "Turn context 例題"
    cases:
      - hand: top_pair
        draw: no_draw
        context: turn
      - hand: overpair
        draw: no_draw
        context: turn

  - type: prose
    body: |
      **問 19 解説 (top_pair, turn)**:
      CBS=7 (strong), turn context → 30% → バレル継続を検討。
      TA+ ターン (ブロードウェイ) なら 30% でバレル。TA- ターン (ロー) なら 20% 前後に下げてチェックバック寄り。

      **問 20 解説 (overpair, turn)**:
      CBS=7 (strong), turn context → 30%。
      overpair は top_pair と同バンドです。ターンでの扱いは同じく 30% 前後が目安。
      フロップで cbet してターンでバレルする計画を立てていた場合はそのまま実行します。

  - type: heading
    level: 2
    text: "3bp context の追加例題 (問 16-18)"

  - type: examples
    framework: light
    title: "3-bet pot context 例題"
    cases:
      - hand: overpair
        draw: no_draw
        context: 3bp
      - hand: second_pair
        draw: no_draw
        context: 3bp
      - hand: ace_high
        draw: no_draw
        context: 3bp

  - type: prose
    body: |
      **問 16 解説 (overpair, 3bp)**:
      CBS=7 (strong), 3bp context → 70% → ベット推奨。
      3bp の strong バンドは cash (60%) より高い 70% です。コミット圧力を活かしてバリューを積みます。

      **問 17 解説 (second_pair, 3bp)**:
      CBS=5 (mid), 3bp context → 60% → ベット推奨 (境界を超える)。
      cash context の mid (40%) より大きく異なる点が 3bp の特徴です。
      SPR が低いため、second pair でも積極的にポットを積むのが GTO に近い判断です。

      **問 18 解説 (ace_high, 3bp)**:
      CBS=2 (air), 3bp context → 45% → チェック寄り (境界付近)。
      3bp の air は cash と同じ 45% です。ブラフを選ぶ場合はドロー付き (gutshot, fd) を優先します。

  - type: heading
    level: 2
    text: "まとめ"

  - type: prose
    body: |
      - 20 スポット全問を通して Light UCBS (10 問) / Full UCBS (5 問) / DCBS (5 問) を体験した。
      - strong / nut バンドはどの context でも bet 推奨になる傾向がある。
      - mid バンドが最も判断に幅があり、context と TA+/TA- で大きく変わる。
      - 3bp context は cash より mid/strong が高い (コミット圧力の反映)。
      - turn context は全バンドで大きく下がる (strong 30%, nut 40% が最大)。
      - DCBS は HP=2 (air) の 40% のみが fold 領域、他はほぼ continue。
      - 境界ハンドは Full UCBS-v2 で精密計算するか GTO Wizard で確認する。
