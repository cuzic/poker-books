volume: "Vol3"
chapter_num: "13"
title: "相手タイプ別エクスプロイト — フロップ攻守両面"
street: "flop"

summary: |
  GTO は「相手が均衡戦略を取る」前提の解。実戦の相手は偏りを持つ。
  本章では IP（攻撃側: CBet）と OOP（守備側: ディフェンス）の両面で
  4 タイプ（Fish / Station / Nit / LAG）に対する最適エクスプロイトを解説する。
  キー原則: 「相手が多くやること（コール/フォールド/ブラフ）を逆用する」

key_formulas:
  "タイプ識別 (VPIP / PFR / Fold to CBet%)":
    |
    Fish:    VPIP>40%, PFR<15%, Fold%<40%  → 広くコール、ブラフなし
    Station: VPIP>35%, PFR<10%, Fold%<35%  → 何でもコール、ブラフも少し
    Nit:     VPIP<20%, PFR<15%, Fold%>65%  → タイトに参加、ベット=強い
    LAG:     VPIP>30%, PFR>25%, Fold%<50%  → 広く打つ、ブラフ多い
    Reg:     VPIP 22-30%, PFR 18-25%       → GTO に近い基準

  "IP (CBet 側) 攻撃調整":
    |
    【vs Fish / Station (フォールドしない)】
    目標: バリューを最大化、ブラフを削除

    CBet 決断 (HS 閾値 → +10 引き上げ):
      T1 通常閾値 HS≥65 → HS≥65 (変わらず: T1 は必ずベット)
      T2 閾値 HS≥20: +10 → HS≥30 のみ CBet (TPWK+ 以上)
      T3 ブラフ: 禁止 (相手がフォールドしないためブラフは -EV)

    CBet サイズ:
      T1 (HS≥65): 75% pot (バリュー最大化。相手はポットオッズを無視する)
      T2 (HS 30-64): 50% pot (薄いバリューも大きく)
      例: vs Fish, K72r, AK (HS=65) → CBet 75%

    【vs Nit (フォールドが多い)】
    目標: ブラフ頻度を増やし、バリューは小サイズで誘う

    CBet 決断 (HS 閾値 → -5 引き下げ):
      T2 閾値: B≥58 → B≥53 に緩和 (T2 下位も打てる)
      T3 ブラフ: dry board (B≥55) なら打てる (通常は B≥62 が基準)

    CBet サイズ:
      T1 (HS≥65): 33% pot (小サイズで Nit を誘う。大サイズはフォールドを招く)
      T2/T3: 33% pot (ブラフも小サイズで MDF を下げる)
      注意: Nit が CR/re-raise → 本物の強ハンド → 即フォールド

    【vs LAG (アグレッシブ)】
    目標: バリューは確実に、ブラフは絞る。LAG の 3-bet/CR を警戒

    CBet 決断: 通常の T1/T2/T3 基準を維持 (調整なし)
      T3 ブラフ: 削減 (LAG はブラフで 3-bet してくる可能性あり)

    CBet サイズ:
      T1: 50% pot (LAG の 3-bet に備えてサイズを抑える)
      T2: 33% pot (LAG の CR が怖いため小サイズ)
      T3 ブラフ: 基本なし (LAG に 3-bet されると詰まる)

  "OOP (守備側) ディフェンス調整":
    |
    【vs Fish / Station (ブラフが少ない)】
    Fish のベット = バリュー強 → fold threshold を上げる
    Station のベット = バリュー + 少しブラフ → 通常に近い

    vs Fish CBet:
      fold threshold: +10 (Fish がベットする = かなり強い)
      例: vs33% 通常閾値 HS<15 → HS<25 でフォールド
      CR: 禁止に近い (Fish のベットに CR してもフォールドしない + バリュー強)
      Donk: なし (Fish のレンジ不明確、先手は不利)

    vs Station CBet:
      fold threshold: +5 (Station のベットも比較的強め)
      例: vs33% 通常閾値 HS<15 → HS<20
      CR: 通常通り (HS≥40+ and B≥70)

    【vs Nit (ブラフがほぼない)】
    Nit のベット = 強いハンド → さらに多くフォールド

    vs Nit CBet:
      fold threshold: +5 (Nit のベット = T1 以上相当)
      例: vs33% 通常閾値 HS<15 → HS<20
      vs75% 通常閾値 HS<35 → HS<40
      CR: HS≥80 のみ (ナッツ相当でないと CR は危険)
      Donk: なし

    【vs LAG (ブラフが多い)】
    LAG のベット = バリューもブラフも多い → 広くコール

    vs LAG CBet:
      fold threshold: -10 (LAG のブラフに乗る)
      例: vs33% 通常閾値 HS<15 → HS<5 程度までコール
      vs75% 通常閾値 HS<35 → HS<25 でコール
      CR: HS≥40 で積極的に (LAG のブラフに対して CR が +EV)
      Donk: 低い (LAG に逆 CR されるリスク)

  "まとめ: タイプ × ポジション調整表":
    |
    ────────────────────────────────────────────────────────
    タイプ       | IP CBet閾値  | IP サイズ | OOP fold th | OOP CR
    ────────────────────────────────────────────────────────
    Fish         | T1のみ(+10)  | 75%       | +10         | 禁止
    Station      | T1+T2上位(+5)| 50-75%    | +5          | 通常
    Nit          | T2拡大(-5)   | 33%       | +5          | HS≥80のみ
    LAG          | 通常/T3削減  | 50%       | -10         | HS≥40で積極
    ────────────────────────────────────────────────────────

examples:
  - hand: "AKs"
    board: "Kc,7d,2s"
  - hand: "AQo"
    board: "Kc,7d,2s"
  - hand: "65s"
    board: "Kc,7d,2s"
  - hand: "JTs"
    board: "Jc,Td,5s"
  - hand: "AQo"
    board: "9s,8d,7c"
  - hand: "88"
    board: "Kc,7d,2s"

gto_reference:
  source: "エクスプロイト戦略 — MDF と α の関係から導く調整量"
  notes: |
    エクスプロイトの数理的根拠:
    GTO fold = α (ベットサイズ比率)。vs33%→25%, vs75%→43%
    Fish の実際 fold% < 20% (理論の 25% より低い)
      → IP ブラフの EV = (fold% - α) × pot < 0 → ブラフ禁止
    Nit の実際 fold% > 65% (理論の 25% より高い)
      → IP ブラフの EV > 0 → ブラフ増加

    エクスプロイト量の目安:
      確実 (100+ hand 実績): ±10 調整
      推定 (50-100 hand):    ±5 調整
      不明 (<50 hand):       GTO ベースを維持

key_points:
  - "Fish: IP は T1 のみ大サイズ。OOP は fold threshold +10 (Fishのベット=強い)"
  - "Nit: IP はブラフ増加・小サイズ。OOP は fold threshold +5 (Nitのベット=超強)"
  - "LAG: IP はバリュー絞り。OOP は fold threshold -10 で広くコール・積極 CR"
  - "Station: IP は薄いバリューまでベット (50-75%)。OOP は通常+αのコール"
  - "相手のサンプルが少ない (<50 hand) → GTO 基準を維持"
  - "LAG の CR/re-raise には注意: ブラフだけでなくバリューも含む"

sections:
  - title: "なぜ GTO だけでは EV を捨てるか"
    summary: |
      GTO は「相手も最善を尽くす」前提の均衡解。相手が偏りを持つ場合、
      その偏りを「利用しない」ことが EV ロスになる。
      Fish が毎回コール → ブラフ EV < 0 なのに打ち続けるのは損。
      Nit が毎回フォールド → ブラフ EV > 0 なのに打たないのも損。
      エクスプロイトとは「相手の偏りを数値で捉えて戦略を曲げること」。
  - title: "Fish・Station: IP 攻撃の最適化"
    summary: |
      Fish/Station は「フォールドしない」が共通の弱点。
      IP での最適戦略:
        ①ブラフを削除 (T3 CBet禁止)
        ②バリューサイズを最大化 (75% pot)
        ③T2 の中間手も絞る (HS≥30 のみ CBet)
      Fish が CBet に対してコール → ターンでも引き続き大サイズでバリューを続ける。
      「薄いバリューでも大きく打てる」のが Fish/Station 相手の強みになる。
  - title: "Fish・Station: OOP 守備の最適化"
    summary: |
      Fish は「コールが多いがブラフはしない」→ Fish がベットした = バリュー強。
      OOP での最適戦略:
        ①fold threshold を +10 上げる (Fish のベットは T1 相当以上が多い)
        ②ブラフキャッチ (CR/コール) を減らす
        ③チェックバック狙い: Fish が CBet しなければ弱いハンドでもショーダウン価値あり
      Station は Fish より少しブラフが多い → +5 程度の調整で OK。
  - title: "Nit: IP でブラフを増やし、OOP で降りる"
    summary: |
      Nit の弱点は「フォールドしすぎること」。
      IP での最適戦略:
        ①T3 ブラフ閾値を緩和 (B≥55 で CBet)
        ②バリューサイズを小さくして誘う (33%)
        ③Nit の CR/3-bet = 本物の強ハンド → 即フォールド
      OOP での最適戦略:
        ①Nit がベット = 超強レンジ → fold threshold +5
        ②Nit のベットに対して弱いハンドは迷わずフォールド
        ③Nit のチェック = 弱め → チェックバックで情報収集
  - title: "LAG: OOP でブラフキャッチ、IP でバリューを絞る"
    summary: |
      LAG の弱点は「ブラフが多すぎること」。
      OOP での最適戦略:
        ①fold threshold -10 (HS≥5 でもコール候補に入れる)
        ②積極的 CR: HS≥40 で LAG のブラフを CR でペナルティ
        ③ブラフキャッチャー (HS=20-40) も十分機能する
      IP での最適戦略:
        ①T3 ブラフ削減 (LAG が 3-bet で返してくるリスク)
        ②バリューサイズを抑える (50% pot、LAG に逆 CR されにくくする)
        ③LAG のチェックに対しても薄いバリューを慎重に
