volume: "Vol3"
chapter_num: "09"
title: "3-bet pot 詳細 — SPR ~3 の commit-or-fold"

summary: |
  3-bet pot (preflop で raise + re-raise が入ったポット) は SPR が低く commit-or-fold の世界です。
  この章では 3bp の特殊性と、Vol3 の bucket-based 公式がほぼそのまま適用できることを解説します。

sections:

  - type: heading
    level: 2
    text: "3bp の SPR と特殊性"

  - type: prose
    body: |
      3-bet pot (3bp) は preflop で「open raise → 3-bet → call」が起きた局面。Pot が大きく、残スタックが小さいため SPR が下がります。

  - type: table
    title: "Single raised pot (SRP) vs 3-bet pot (3bp) の SPR"
    markdown: |
      | depth | SRP flop 後 SPR | 3bp flop 後 SPR |
      |-------|-----------------|----------------|
      | Cash 100bb | ~18 | ~5 |
      | Cash 200bb | ~36 | ~10 |
      | MTT 50bb | ~9 | ~2.5 |
      | MTT 100bb | ~18 | ~5 |

  - type: prose
    body: |
      Cash 100bb の **3bp flop SPR = 5** は、MTT 50bb の **SRP turn SPR = 3** に近い。つまり Cash 100bb 3bp は **MTT 50bb の turn 相当** の意味を持ちます。

      **結論:** **3bp の judgements は bucket-based 公式 (MTT 50bb turn v9 相当)** が支配的。

  - type: heading
    level: 2
    text: "3bp 防御公式 (簡易版)"

  - type: prose
    body: |
      3bp の defense は本書では簡易扱いとします (詳細データ少のため)。基本方針:

  - type: code
    lang: ""
    body: |
      3-bet pot defense (簡易):

      ── BB defends 3bp ──
      (例: BTN open → BB 3bet → BTN call → 3bp flop)

      Vol3 の Turn defense MTT 50bb v9 公式を流用 (bucket-based):

      best_hands:
        vs overbet → 強メイドは RAISE (commit)、else CALL
        vs small → CALL
      good_hands:
        vs overbet → 強メイドは RAISE、else CALL
        vs small → CALL
      weak_hands:
        vs overbet → 強ドロー (FD/OESD/combo) ∧ 非monotone → CALL、else FOLD
        vs small → CALL
      trash_hands:
        vs overbet → FOLD
        vs small → 強ドロー ∧ 非monotone → CALL、else FOLD

  - type: prose
    body: |
      これは MTT 50bb turn v9 とほぼ同じ。SPR が同程度 (3bp の SPR 5 と MTT 50bb turn の SPR 3) のため、自然に同じ公式に収束。

  - type: heading
    level: 2
    text: "3bp 攻撃公式 (簡易版)"

  - type: prose
    body: |
      3bp の attack (こちらが 3bettor で OOP cbet を判断する) も簡易扱い:

      - **strong made (set, 2P+, overpair)**: BET (66% pot 推奨、cbet で commit 寄り)
      - **TP**: BET on dry / CHECK on dynamic (Vol2 と同じ)
      - **medium (2nd/3rd pair)**: CHECK (showdown 維持)
      - **air**: CHECK or BET 高頻度 (range advantage、3bettor は wider top range)
      - **draws**: CHECK or semibluff BET (small-medium)

      3bp は 3bettor の range advantage が強いため、SRP より cbet 頻度が高くなる傾向。実戦では「3bp flop は強気に cbet」と覚えれば 80% 正解。

  - type: heading
    level: 2
    text: "3bp 特有の重要パターン"

  - type: prose
    body: |
      **パターン 1: AKo on K-7-2 (TPTK on K-high dry) in 3bp**

      - 3bp の BB defender は KQ や KJ をあまり持たない → AKo の TPTK は 3bp で strong
      - cbet されたら CALL/RAISE どちらも妥当
      - turn の continuation も check-call で十分

      **パターン 2: 88 (underpair) on K-7-2 in 3bp**

      - 3bp の BTN cbettor の range は narrow strong (TT+, AK)
      - 88 は underpair で実質 W (相手の TT+ に負ける)
      - SPR が低いため call で turn まで連れるリスク大
      - **大きい cbet (66%+)** に対しては **FOLD 寄り**

      これは SRP の同じハンド (call で turn を見にいく) と挙動が逆。3bp の SPR の低さが原因。

      **パターン 3: 64s (suited connector) on K-7-2 in 3bp**

      - 64s は 3bp の preflop call range に含まれることがある (suited で playability)
      - K-7-2 で no_made + BDFD → bucket trash
      - 大きい cbet には FOLD、small cbet には call も可

  - type: heading
    level: 2
    text: "SPR-based 公式選択の再確認"

  - type: prose
    body: |
      ch08 で触れた **「SPR で公式を選ぶ」** が 3bp で実証されます。

      - **Cash 100bb 3bp flop SPR ~5** → MTT 50bb turn と同じ公式 (bucket-based v9)
      - **Cash 200bb 3bp flop SPR ~10** → Cash 100bb SRP flop と同じ公式 (Vol2 のマトリックス)
      - **MTT 50bb 3bp flop SPR ~2.5** → ほぼ commit-or-fold (super tight defense)

      **実戦的判断フロー:**

      1. **3bp に入ったらまず SPR を計算**: 残スタック ÷ flop 後のポット
      2. **SPR ≥ 7** → Vol2 マトリックス (mv 軸)
      3. **SPR 3-7** → bucket + mv override (v14)
      4. **SPR ≤ 3** → 真 all-in 公式 (v15) または bucket-based commit-or-fold (v9)

  - type: heading
    level: 2
    text: "簡易扱いに留める理由"

  - type: prose
    body: |
      本書は 3bp を簡易扱いに留めます。理由:

      - **3bp の検証データが少ない** — 現サブスクで詳細な 3bp 取得は難しい
      - **基本公式 (v9 / v14 / v15) でほぼ動く** — 3bp 専用の特殊公式は不要
      - **SPR-based 公式選択でカバー可能** — 「3bp だから特別」ではなく「SPR が低いから普遍公式適用」

      上級者向けの 3bp 詳細は将来の研究課題とします。

  - type: heading
    level: 2
    text: "次の章へ"

  - type: prose
    body: |
      3bp の簡易扱いを学びました。次の ch10 では **ICM 補正** を扱います。ICM もデータ限界がありますが、理論方針を提示します。
