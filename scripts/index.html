<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計算で勝つテキサスホールデム シリーズ</title>
  <style>
    :root {
      --fg: #222;
      --bg: #fafafa;
      --accent: #3b6ea8;
      --muted: #666;
      --border: #ddd;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      color: var(--fg);
      background: var(--bg);
      max-width: 780px;
      margin: 0 auto;
      padding: 2em 1em 6em;
      line-height: 1.85;
    }
    header {
      text-align: center;
      margin-bottom: 3em;
      padding-bottom: 2em;
      border-bottom: 2px solid var(--accent);
    }
    header h1 { font-size: 2em; color: var(--accent); margin: 0 0 0.3em; }
    header p { color: var(--muted); margin: 0; }
    article.book {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5em 2em;
      margin: 1.5em 0;
    }
    article.book h2 { color: var(--accent); margin-top: 0; }
    article.book .status { color: var(--muted); font-size: 0.9em; }
    article.book .read {
      display: inline-block;
      margin-top: 1em;
      padding: 0.5em 1.2em;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
    article.book .read:hover { opacity: 0.85; }
    footer { margin-top: 3em; color: var(--muted); font-size: 0.9em; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>計算で勝つテキサスホールデム</h1>
    <p>暗算できる計算式で判断する、初級者〜中級者向けの書籍シリーズ</p>
  </header>

  <article class="book">
    <h2>第1巻　プリフロップは計算で勝つ</h2>
    <p>レンジ暗記に頼らない、簡易計算式で覚えるポーカー入門。全 22 章。</p>
    <p class="status">核となる式: <code>Score = H + L + ボーナス − ペナルティ</code></p>
    <a class="read" href="preflop.html">読む →</a>
  </article>

  <article class="book">
    <h2>第2巻　フロップは構造で勝つ</h2>
    <p>ボードを読み、式で判断するフロップ戦略。全 27 章。</p>
    <p class="status">核となる式: <code>BoardScore</code> / <code>HandScore</code> / <code>CBet スコア</code></p>
    <a class="read" href="flop.html">読む →</a>
  </article>

  <footer>
    <p>ソース: <a href="https://github.com/cuzic/poker-books">cuzic/poker-books</a></p>
  </footer>
</body>
</html>
